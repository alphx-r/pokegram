<style>
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  html,body{
    margin:0;height:100%;height:100dvh;width:100%;font-family:'Nunito',sans-serif;background:#f4f4f4;color:#1a1a1a;
    overflow:hidden;position:fixed;inset:0;
    display:flex;flex-direction:column;
  }
  :root{
    --brand:#b71c1c;--brand-mid:#e53935;--accent:#fdd835;--border:#e0e0e0;--muted:#6b7280;
  }
  .gf-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;height:52px;flex:0 0 52px;background:var(--brand);
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .gf-back{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:13px}
  .gf-back svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .gf-title{font-family:'Cinzel',serif;font-size:15px;color:#fff}
  .gf-title span{color:var(--accent)}

  .gf-wrap{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:0;overflow:hidden;
  }
  #gf-canvas{
    background:linear-gradient(#8fc8f7,#c9e8ff);
    touch-action:none;max-width:100%;display:block;
  }
  .gf-canvas-wrap{position:relative;max-width:100%;max-height:100%;line-height:0}
  #gf-bird-sprite{
    position:absolute;top:0;left:0;pointer-events:none;display:none;
    image-rendering:pixelated;transform-origin:center center;
  }
  .gf-hud{
    position:absolute;top:0;left:0;right:0;z-index:20;margin-top:5px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;
  }
  .gf-hud-box{
    display:flex;flex-wrap:wrap;row-gap:4px;gap:clamp(14px,5vw,28px);align-items:center;justify-content:center;
    background:rgba(255,255,255,.82);border-radius:10px;
    padding:13.5px clamp(26.5px,5vw,34.5px);box-shadow:0 2px 8px rgba(0,0,0,.2);
    max-width:calc(100% - 20px);
  }
  .gf-hud-item{
    flex:0 1 auto;white-space:nowrap;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .gf-hud-label{font-size:clamp(7px,2.2vw,9px);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;line-height:1}
  .gf-hud-value{font-family:'Cinzel',serif;font-size:clamp(13px,4vw,18px);color:var(--brand);font-weight:700;white-space:nowrap;line-height:1}
  .gf-hud-value.gf-hud-sm{font-size:clamp(11px,3.4vw,15px)}
  .gf-enigma-result{
    background:rgba(255,255,255,.9);border-radius:8px;
    padding:4px 14px;box-shadow:0 2px 6px rgba(0,0,0,.18);
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;
    white-space:nowrap;opacity:0;transform:translateY(-4px);
    transition:opacity .2s ease,transform .2s ease;pointer-events:none;
  }
  .gf-enigma-result.show{opacity:1;transform:translateY(0)}
  .gf-hint{
    position:absolute;top:calc(50% - 30px);left:10px;right:10px;z-index:20;
    font-size:13px;color:rgba(26,26,26,.55);text-align:center;font-weight:600;
    text-shadow:0 1px 3px rgba(255,255,255,.6);pointer-events:none;
  }

  .gf-lb{width:100%;max-width:340px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px}
  .gf-lb-title{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .gf-lb-row{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:12px}
  .gf-lb-pos{width:16px;font-weight:800;color:var(--brand-mid)}
  .gf-lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gf-lb-score{font-weight:800}
  .gf-lb-empty{font-size:11.5px;color:var(--muted);font-style:italic}

  .gf-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:center;z-index:300;
  }
  .gf-overlay.show{display:flex}
  .gf-modal{background:#fff;border-radius:14px;padding:26px 24px;max-width:320px;width:88%;text-align:center}
  .gf-modal h2{font-family:'Cinzel',serif;color:var(--brand);margin:0 0 6px;font-size:20px}
  .gf-modal p{color:var(--muted);font-size:13px;margin:0 0 16px}
  .gf-final-score{font-family:'Cinzel',serif;font-size:32px;color:var(--brand-mid);margin-bottom:16px}
  .gf-btn{
    padding:10px 22px;border:none;border-radius:8px;background:var(--brand-mid);color:#fff;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;cursor:pointer;width:100%;
  }
  .gf-btn:hover{background:var(--brand)}
  #gf-share-btn:hover{background:#d98a1f}

<nav class="gf-nav">

    Jogos

<div class="gf-wrap">
  <div class="gf-canvas-wrap">
    <canvas id="gf-canvas"></canvas>
    <img id="gf-bird-sprite" alt="">
    <div class="gf-hud">
      <div class="gf-hud-box">
        <div class="gf-hud-item">
          <div class="gf-hud-label">Pontos</div>

<script src="/games-common.js"></script>
<script>
// ════════════════════════════════════════════════════════
// FLAPIDGEY — Flappy Bird com um Pidgey no lugar do pássaro
// ════════════════════════════════════════════════════════

const canvas = document.getElementById('gf-canvas');
const ctx = canvas.getContext('2d');
const birdSpriteEl = document.getElementById('gf-bird-sprite');

// ── Sprite do Pidgey (customizável) ─────────────────────
// Pra trocar a imagem/GIF do pássaro, troca a URL abaixo OU, sem editar
// código, guarda a URL na tabela `settings` do Supabase com a chave
// 'flapidgey_sprite' (mesmo padrão usado por network_logo/splash_gif):
//   insert into settings (key, value) values ('flapidgey_sprite', 'https://.../pidgey.gif')
//   on conflict (key) do update set value = excluded.value;
// Se nenhuma das duas estiver definida, cai no desenho vetorial original.
const FLAPIDGEY_SPRITE_URL = 'https://64.media.tumblr.com/802e179f72cf2487530ccb5aa9bb27c5/4603906cfe87268f-b3/s75x75_c1/1c728feb8f32ec554fd9a30c5bdb0be02b6e4007.gif'; // ex: 'https://.../pidgey.gif' — deixe vazio para usar o Supabase ou o desenho padrão
const BIRD_SPRITE_SIZE = 34; // tamanho do sprite em px (na resolução lógica do canvas)
let birdSpriteReady = false;

async function loadBirdSprite() {
  let url = FLAPIDGEY_SPRITE_URL;
  if (!url) {
    try {
      const { data, error } = await gdb.from('settings').select('value').eq('key', 'flapidgey_sprite').maybeSingle();
      if (error) console.warn('[loadBirdSprite] erro ao buscar sprite', error);
      if (data && data.value) url = data.value;
    } catch (e) { console.warn('[loadBirdSprite]', e); }
  }
  if (!url) return; // sem sprite configurado: mantém o desenho vetorial
  // crossOrigin='anonymous' é essencial: sem isso, ao desenhar essa imagem
  // (de outro domínio, ex. tumblr) num <canvas> e depois chamar
  // canvas.toDataURL() (usado em shareResultToStories/buildResultCanvas),
  // o canvas fica "tainted" e o navegador lança SecurityError — o que era
  // engolido silenciosamente pelo try/catch de shareResultToStories() e
  // fazia o compartilhamento falhar sem aviso (só voltava pra home).
  birdSpriteEl.crossOrigin = 'anonymous';
  birdSpriteEl.onload = () => {
    birdSpriteEl.style.display = 'block';
    birdSpriteEl.style.width = BIRD_SPRITE_SIZE * scale + 'px';
    birdSpriteEl.style.height = BIRD_SPRITE_SIZE * scale + 'px';
    birdSpriteReady = true;
  };
  birdSpriteEl.onerror = () => { birdSpriteReady = false; birdSpriteEl.style.display = 'none'; };
  birdSpriteEl.src = url;
}

function updateBirdSpritePosition() {
  if (!birdSpriteReady) return;
  const x = bird.x * scale - (BIRD_SPRITE_SIZE * scale) / 2;
  const y = bird.y * scale - (BIRD_SPRITE_SIZE * scale) / 2;
  birdSpriteEl.style.transform = `translate(${x}px, ${y}px) rotate(${bird.rot}rad)`;
  birdSpriteEl.style.opacity = getBirdOpacity();
}

// Enquanto a invulnerabilidade da enigma está ativa, o Pidgey pisca
// alternando entre 100% e 50% de opacidade (fora disso, opacidade normal).
const ENIGMA_BLINK_INTERVAL = 120; // ms — velocidade do piscar
const ENIGMA_BLINK_START = 1; // s restantes de intangibilidade a partir dos quais começa a piscar
function getBirdOpacity() {
  if (enigmaInvuln <= 0) return 1;
  if (enigmaInvuln > ENIGMA_BLINK_START) return 0.5; // opacidade fixa até faltar o último segundo
  return (Math.floor(performance.now() / ENIGMA_BLINK_INTERVAL) % 2 === 0) ? 1 : 0.5;
}

const BASE_W_MIN = 260, BASE_H_MIN = 380;
let BASE_W = 320;
let BASE_H = 480;
let scale = 1;

const GRAVITY = 1400;      // px/s²
const FLAP_VELOCITY = -380;
const PIPE_GAP = 130;
const PIPE_WIDTH = 52;
const PIPE_SPEED = 130;    // px/s
const CLOUD_SPEED = PIPE_SPEED * 0.3; // px/s — mais lenta que os canos (parallax)
const CLOUD_WIDTH_MAX = 120; // px — largura aprox. máx. de uma nuvem, usada pra saber quando ela saiu da tela (ajustado para as nuvens maiores)

// ── Céu dinâmico conforme a pontuação (ciclo de dia/noite) ─
// Ciclo de CYCLE_LENGTH pontos, que se repete indefinidamente via
// (score % CYCLE_LENGTH):
//   0–149    dia (fixo)
//   150–299  transição dia → entardecer
//   300–599  transição entardecer → noite
//   600–899  noite (fixo)
//   900–999  transição noite → manhã (amanhece de volta pro dia)
const CYCLE_LENGTH   = 1000;
const DAY_END        = 150;
const DUSK_END       = 300;
const NIGHT_START     = 600;
const DAWN_START     = 900;
const SKY_DAY   = ['#8fc8f7', '#c9e8ff'];
const SKY_DUSK  = ['#6b4984', '#f2a33c'];
const SKY_NIGHT = ['#050914', '#16213e'];

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function lerpColor(a, b, t) {
  const pa = hexToRgb(a), pb = hexToRgb(b);
  const r = Math.round(pa.r + (pb.r - pa.r) * t);
  const g = Math.round(pa.g + (pb.g - pa.g) * t);
  const bl = Math.round(pa.b + (pb.b - pa.b) * t);
  return `rgb(${r},${g},${bl})`;
}
function lerpSky(skyA, skyB, t) {
  return [lerpColor(skyA[0], skyB[0], t), lerpColor(skyA[1], skyB[1], t)];
}

// smoothstep: suaviza início/fim da transição em vez de andar linear
function easeInOut(t) {
  return t * t * (3 - 2 * t);
}

// Fases do ciclo, em ordem: from/to = degradê de origem/destino (to = null quando é fase fixa, sem transição)
const SKY_PHASES = [
  { start: 0,           end: DAY_END,      from: SKY_DAY,   to: null      },
  { start: DAY_END,     end: DUSK_END,     from: SKY_DAY,   to: SKY_DUSK  },
  { start: DUSK_END,    end: NIGHT_START,  from: SKY_DUSK,  to: SKY_NIGHT },
  { start: NIGHT_START, end: DAWN_START,   from: SKY_NIGHT, to: null      },
  { start: DAWN_START,  end: CYCLE_LENGTH, from: SKY_NIGHT, to: SKY_DAY   },
];

function updateSkyBackground() {
  const s = score % CYCLE_LENGTH;
  const phase = SKY_PHASES.find(p => s < p.end) || SKY_PHASES[SKY_PHASES.length - 1];
  const [top, bottom] = phase.to
    ? lerpSky(phase.from, phase.to, easeInOut((s - phase.start) / (phase.end - phase.start)))
    : phase.from;
  canvas.style.background = `linear-gradient(${top}, ${bottom})`;
}
const PIPE_INTERVAL_BASE = 1150;   // ms — distância "padrão" entre canos
const PIPE_INTERVAL_VARIANCE = 250; // ms — variação aleatória pra mais/menos a cada cano
const PIPE_INTERVAL_FLOOR = 1100;   // ms — piso mínimo: nunca deixa os canos mais próximos que isso, mesmo com a variação negativa
// Velocidade de subida que dá pra manter batendo asas num ritmo confortável
// (bem abaixo do que a física permite no auge, de propósito — sobra folga
// pra reação) e uma folga fixa de reação, usadas só pra GARANTIR tempo
// físico de chegar na boca do próximo cano quando ela exige subir (ver
// spawnPipe). Descidas não precisam disso: a gravidade sozinha já dá conta
// rápido o bastante mesmo pro deslocamento máximo (PIPE_GAP_MAX_SHIFT).
const PIPE_CLIMB_SPEED_ASSUMED = 200;   // px/s
const PIPE_CLIMB_REACTION_BUFFER = 300; // ms
const PIPE_SCORE = 5;      // pontos ganhos ao passar de cada cano
const HIT_INVULN_TIME = 1; // segundos de proteção após usar uma vida da sitrus berry

// ── Berries coletáveis ──────────────────────────────────
// oran agora é garantida (aparece a cada 5-10 canos, sorteado a cada
// vez — ver nextOranAt/spawnPipe). "chance" nas outras três ainda é a
// probabilidade de aparecer a cada cano, fora da oran garantida.
// Raridade: enigma (raríssima) < starf (rara) < sitrus (menos rara).
// enigma dá um bônus aleatório (ver ENIGMA_BONUSES/collectBerry); starf
// dá pontos fixos (assumiu o papel que a enigma tinha antes).
const BERRY_TYPES = {
  oran:   { sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/oran-berry.png',   color: '#3f7fd1', chance: 0, points: 10 },
  sitrus: { sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/sitrus-berry.png', color: '#f2a33c', chance: 0.06, life: 1   },
  starf:  { sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/starf-berry.png',  color: '#6b3fa0', chance: 0.015, points: 25 },
  enigma: { sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/enigma-berry.png', color: '#c94f7c', chance: 0.01, random: true },
};

// Os três bônus possíveis da enigma, sorteados com chance igual entre si
// ao coletar (ver collectBerry).
const ENIGMA_BONUSES = [
  { type: 'invuln', seconds: 5 },
  { type: 'points', amount: 50 },
  { type: 'points', amount: -15 },
];
const ENIGMA_RESULT_DISPLAY_TIME = 1.5; // s — quanto tempo o resultado de pontos fica visível no badge
const BERRY_SIZE = 33; // 41.25 * 0.8 (20% menor)
const BERRY_R = 16.5;  // 20.625 * 0.8 (20% menor)
const BERRY_BUBBLE_PADDING = 6; // px de "respiro" branco ao redor da fruta, dentro da bolha
const BERRY_BUBBLE_R = (BERRY_R + BERRY_BUBBLE_PADDING) * 0.7; // raio da bolha, 30% menor que o original
const BERRY_BUBBLE_OPACITY = 0.6; // opacidade da bolha, desenhada por cima da fruta
const ORAN_MIN_GAP = 5, ORAN_MAX_GAP = 10; // a oran aparece a cada 5-10 canos

const berryImgs = {};
Object.keys(BERRY_TYPES).forEach(key => {
  const img = new Image();
  berryImgs[key] = { img, ready: false };
  img.onload  = () => { berryImgs[key].ready = true; };
  img.onerror = () => { berryImgs[key].ready = false; };
  img.src = BERRY_TYPES[key].sprite;
});

// Sorteia, na ordem mais rara → mais comum, se aparece enigma, starf ou
// sitrus nesse cano (a oran é tratada à parte, de forma garantida — ver
// spawnPipe). r < 0.01 → enigma; r < 0.025 → starf; r < 0.085 → sitrus;
// senão nada.
function rollBerryType() {
  const r = Math.random();
  let acc = 0;
  for (const key of ['enigma', 'starf', 'sitrus']) {
    acc += BERRY_TYPES[key].chance;
    if (r < acc) return key;
  }
  return null;
}

// Bolha branca translúcida por CIMA de cada fruta (desenhada depois do
// sprite/fallback), pra dar aquele efeito de fruta "flutuando dentro" da
// bolha sem esconder ela por completo.
function drawBerryBubble(b) {
  ctx.save();
  ctx.globalAlpha = BERRY_BUBBLE_OPACITY;
  ctx.beginPath();
  ctx.arc(b.x, b.y, BERRY_BUBBLE_R, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();
}

function drawBerryFallback(b) {
  const color = BERRY_TYPES[b.type].color;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(0, 2, BERRY_R, BERRY_R - 1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(-3, -1, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3d7a2e';
  ctx.beginPath(); ctx.ellipse(0, -BERRY_R + 1, 3, 5, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function updateLivesHUD() {
  document.getElementById('gf-lives').textContent = `${lives}`;
}

// Badge abaixo do container do HUD com o resultado da última enigma
// coletada: contagem regressiva enquanto a intangibilidade estiver ativa,
// ou o texto de pontos por um tempo curto (ver ENIGMA_RESULT_DISPLAY_TIME).
function updateEnigmaResultUI() {
  const el = document.getElementById('gf-enigma-result');
  if (enigmaInvuln > 0) {
    el.textContent = `Intangível: ${Math.ceil(enigmaInvuln)}s`;
    el.style.color = '#2a9aa1';
    el.classList.add('show');
  } else if (enigmaResultTimer > 0) {
    el.textContent = enigmaResultText;
    el.style.color = enigmaResultColor;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

// Nuvem de fundo, desenhada como um agrupado de elipses sobrepostas
// (formato de nuvem de verdade, em vez de uma bola única). c.scale ajusta
// o tamanho geral da nuvem.
function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.scale, c.scale);
  [[0, 0, 13, 9], [-14, 3, 10, 7], [14, 4, 11, 7], [-4, -6, 10, 8], [10, -5, 9, 7]].forEach(([dx, dy, rx, ry]) => {
    ctx.beginPath(); ctx.ellipse(dx, dy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

// Auréola branca brilhante que envolve o corpo do pidgey enquanto ele
// tem carga(s) de escudo (vidas ganhas de sitrus berry) — centralizada
// no próprio pássaro (não mais deslocada pro lado) e pulsa suavemente
// pra parecer "brilhando" ao redor dele.
function drawShieldGlow() {
  if (lives <= 0) return;
  const pulse = 0.75 + Math.sin(performance.now() / 220) * 0.25; // 0.5–1.0
  const r = 17 + pulse * 4; // raio cobre o corpo inteiro do pidgey (corpo tem ~14px)
  const gx = bird.x, gy = bird.y;
  ctx.save();
  const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, r);
  grad.addColorStop(0, `rgba(255,255,255,${0.55 * pulse})`);
  grad.addColorStop(0.6, `rgba(255,255,255,${0.4 * pulse})`);
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, life: 0.9 });
}

const BUBBLE_POP_LIFE = 0.35; // s — duração da animação de estouro

// Efeito de "bolha de sabão estourando": um anel se expandindo e sumindo
// + gotinhas se espalhando em várias direções, tudo com fade-out.
function spawnBubblePop(x, y, radius) {
  const fragments = [];
  const fragCount = 7;
  for (let i = 0; i < fragCount; i++) {
    const angle = (Math.PI * 2 * i) / fragCount + (Math.random() - 0.5) * 0.5;
    fragments.push({
      angle,
      speed: 70 + Math.random() * 50, // px/s
      r: radius * 0.16 + Math.random() * 1.5,
      x: 0, y: 0,
    });
  }
  bubblePops.push({ x, y, radius, life: BUBBLE_POP_LIFE, fragments });
}

function collectBerry(b) {
  spawnBubblePop(b.x, b.y, BERRY_BUBBLE_R);
  const info = BERRY_TYPES[b.type];
  if (info.points) {
    score += info.points;
    document.getElementById('gf-score').textContent = score;
    addPopup(b.x, b.y, `+${info.points}`, info.color);
  }
  if (info.life) {
    lives += info.life;
    updateLivesHUD();
    addPopup(b.x, b.y, `+${info.life}`, info.color);
  }
  if (info.random) {
    const bonus = ENIGMA_BONUSES[Math.floor(Math.random() * ENIGMA_BONUSES.length)];
    if (bonus.type === 'invuln') {
      invulnerable = Math.max(invulnerable, bonus.seconds);
      enigmaInvuln = Math.max(enigmaInvuln, bonus.seconds);
    } else {
      score = Math.max(0, score + bonus.amount);
      document.getElementById('gf-score').textContent = score;
      const sign = bonus.amount > 0 ? '+' : '';
      enigmaResultText = `${sign}${bonus.amount}`;
      enigmaResultColor = bonus.amount > 0 ? '#2e9e4f' : '#c0392b';
      enigmaResultTimer = ENIGMA_RESULT_DISPLAY_TIME;
    }
  }
}

let bird, pipes, berries, popups, bubblePops, clouds, score, lives, invulnerable, enigmaInvuln, enigmaResultTimer, enigmaResultText, enigmaResultColor, best, gameOver, started, user, lastTs, pipeTimer, pipeCount, nextOranAt, rafId, nextPipeInterval, lastGapY;

// Cria uma nuvem em x (ou fora da tela à direita, se x for omitido), com
// y e escala sorteados dentro de faixas que mantêm elas no céu, no fundo.
function makeCloud(x) {
  return {
    x: x !== undefined ? x : BASE_W + 20 + Math.random() * 40,
    y: 30 + Math.random() * 55,
    scale: 1.3 + Math.random() * 1.1,
  };
}

function rollNextOranAt(fromCount) {
  return fromCount + ORAN_MIN_GAP + Math.floor(Math.random() * (ORAN_MAX_GAP - ORAN_MIN_GAP + 1));
}

function resetGame() {
  bird = { x: 70, y: BASE_H / 2, vy: 0, rot: 0 };
  pipes = [];
  berries = [];
  popups = [];
  bubblePops = [];
  clouds = [makeCloud(40), makeCloud(160), makeCloud(260)];
  score = 0;
  lives = 0;
  invulnerable = 0;
  enigmaInvuln = 0;
  enigmaResultTimer = 0;
  gameOver = false;
  started = false;
  pipeTimer = 0;
  pipeCount = 0;
  nextPipeInterval = PIPE_INTERVAL_BASE;
  lastGapY = null;
  nextOranAt = rollNextOranAt(0);
  lastTs = 0;
  document.getElementById('gf-score').textContent = '0';
  updateLivesHUD();
  document.getElementById('gf-enigma-result').classList.remove('show');
  updateSkyBackground();
  document.getElementById('gf-overlay').classList.remove('show');
  document.querySelector('.gf-hint').style.display = '';
  cancelAnimationFrame(rafId);
  draw();
  rafId = requestAnimationFrame(loop);
}

function flap() {
  if (gameOver) return;
  if (!started) document.querySelector('.gf-hint').style.display = 'none';
  started = true;
  bird.vy = FLAP_VELOCITY;
}

const PIPE_GAP_MAX_SHIFT = 260; // px — deslocamento vertical máximo entre a boca de um cano e a do seguinte, pra nunca pedir uma subida/descida impossível de fazer a tempo

function spawnPipe() {
  const margin = 50;
  let gapY;
  if (lastGapY === null) {
    // primeiro cano da partida — pode nascer em qualquer altura
    gapY = margin + Math.random() * (BASE_H - margin * 2 - PIPE_GAP);
  } else {
    // canos seguintes — a boca só pode se deslocar até PIPE_GAP_MAX_SHIFT
    // px pra cima/baixo em relação ao cano anterior, mantendo a altura
    // sempre alcançável independente de quão alta for a tela
    const minY = Math.max(margin, lastGapY - PIPE_GAP_MAX_SHIFT);
    const maxY = Math.min(BASE_H - margin - PIPE_GAP, lastGapY + PIPE_GAP_MAX_SHIFT);
    gapY = maxY > minY ? (minY + Math.random() * (maxY - minY)) : lastGapY;
  }
  pipes.push({ x: BASE_W, gapY, passed: false });
  pipeCount++;
  maybeSpawnBerryInGap(gapY);

  // Distância até o PRÓXIMO cano: varia aleatoriamente e GARANTE tempo
  // físico suficiente quando a boca deste cano fica mais alta que a do
  // anterior (isso exige SUBIR, batendo asas várias vezes — bem mais lento
  // que descer, que a gravidade resolve sozinha rápido). O tempo mínimo é
  // calculado pela distância real em pixels que precisa ser subida, não por
  // uma fração da altura da tela — do jeito antigo, em telas altas (retrato,
  // celular) a mesma subida em pixels virava uma fração pequena do total e
  // quase não ganhava bônus, mesmo exigindo fisicamente o mesmo tempo de voo.
  let interval = PIPE_INTERVAL_BASE + (Math.random() * 2 - 1) * PIPE_INTERVAL_VARIANCE;
  if (lastGapY !== null && gapY < lastGapY) {
    const climbDistance = lastGapY - gapY;
    const minTravelTime = (climbDistance / PIPE_CLIMB_SPEED_ASSUMED) * 1000 + PIPE_CLIMB_REACTION_BUFFER;
    interval = Math.max(interval, minTravelTime);
  }
  interval = Math.max(PIPE_INTERVAL_FLOOR, interval); // nunca abaixo do piso, mesmo com variação bem negativa
  lastGapY = gapY;
  nextPipeInterval = interval;
}

// Berry nasce dentro do vão aberto do cano que acabou de aparecer —
// nunca em cima da parte sólida do cano — mas perto das bordas desse
// vão (perto da "boca"), em vez de sempre grudada no centro.
function maybeSpawnBerryInGap(gapY) {
  let type = null;
  if (pipeCount >= nextOranAt) {
    type = 'oran';
    nextOranAt = rollNextOranAt(pipeCount);
  } else {
    type = rollBerryType();
  }
  if (!type) return;
  const innerMargin = BERRY_BUBBLE_R + 4; // não deixa a bolha colar na parte sólida do cano
  const minY = gapY + innerMargin;
  const maxY = gapY + PIPE_GAP - innerMargin;
  const y = maxY > minY ? (minY + Math.random() * (maxY - minY)) : (gapY + PIPE_GAP / 2);
  berries.push({ x: BASE_W + PIPE_WIDTH * 0.6, y, type });
}

function update(dt) {
  if (!started) return;
  bird.vy += GRAVITY * dt;
  bird.y += bird.vy * dt;
  bird.rot = Math.max(-0.5, Math.min(1.1, bird.vy / 500));

  if (invulnerable > 0) invulnerable -= dt;
  if (enigmaInvuln > 0) enigmaInvuln -= dt;
  if (enigmaResultTimer > 0) enigmaResultTimer -= dt;
  updateEnigmaResultUI();
  updateSkyBackground();

  pipeTimer += dt * 1000;
  if (pipeTimer > nextPipeInterval) {
    pipeTimer = 0;
    spawnPipe();
  }

  pipes.forEach(p => p.x -= PIPE_SPEED * dt);
  pipes = pipes.filter(p => p.x > -PIPE_WIDTH);

  // nuvens de fundo (parallax): se movem mais devagar que os canos, na
  // mesma direção — dão a sensação de avanço conforme o pidgey voa. Ao
  // sair pela esquerda, a nuvem reaparece à direita com nova altura/escala.
  clouds.forEach(c => {
    c.x -= CLOUD_SPEED * dt;
    if (c.x < -CLOUD_WIDTH_MAX) Object.assign(c, makeCloud());
  });

  berries.forEach(b => b.x -= PIPE_SPEED * dt);
  berries = berries.filter(b => b.x > -BERRY_BUBBLE_R * 2);

  popups.forEach(p => { p.y -= 40 * dt; p.life -= dt; });
  popups = popups.filter(p => p.life > 0);

  bubblePops.forEach(p => {
    p.life -= dt;
    p.fragments.forEach(f => {
      f.x += Math.cos(f.angle) * f.speed * dt;
      f.y += Math.sin(f.angle) * f.speed * dt;
    });
  });
  bubblePops = bubblePops.filter(p => p.life > 0);

  // pontuação dos canos
  pipes.forEach(p => {
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score += PIPE_SCORE;
      document.getElementById('gf-score').textContent = score;
      addPopup(bird.x, bird.y - 20, `+${PIPE_SCORE}`, '#1a1a1a');
    }
  });

  // coleta de berries
  const BIRD_R = 12;
  for (let i = berries.length - 1; i >= 0; i--) {
    const b = berries[i];
    const dx = bird.x - b.x, dy = bird.y - b.y;
    if (Math.hypot(dx, dy) < BIRD_R + BERRY_BUBBLE_R) {
      collectBerry(b);
      berries.splice(i, 1);
    }
  }

  // colisão com chão/teto — sempre fatal, mesmo com vidas da sitrus berry
  if (bird.y < -10 || bird.y > BASE_H - 10) {
    triggerGameOver();
    return;
  }

  // colisão com canos
  if (invulnerable <= 0) {
    for (const p of pipes) {
      const withinX = bird.x + BIRD_R > p.x && bird.x - BIRD_R < p.x + PIPE_WIDTH;
      if (withinX) {
        const hitsTop = bird.y - BIRD_R < p.gapY;
        const hitsBottom = bird.y + BIRD_R > p.gapY + PIPE_GAP;
        if (hitsTop || hitsBottom) {
          if (lives > 0) {
            lives--;
            updateLivesHUD();
            invulnerable = HIT_INVULN_TIME;
            bird.vy = FLAP_VELOCITY * 0.6;
            addPopup(bird.x, bird.y - 16, 'Protegido!', '#f2a33c');
          } else {
            triggerGameOver();
          }
          return;
        }
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, BASE_W, BASE_H);

  // nuvens de fundo (parallax, ver update())
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  clouds.forEach(drawCloud);

  // canos
  pipes.forEach(p => {
    ctx.fillStyle = '#78C850';
    ctx.strokeStyle = '#4d8a2e';
    ctx.lineWidth = 3;
    // cano de cima
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.gapY);
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.gapY);
    ctx.fillRect(p.x - 4, p.gapY - 18, PIPE_WIDTH + 8, 18);
    ctx.strokeRect(p.x - 4, p.gapY - 18, PIPE_WIDTH + 8, 18);
    // cano de baixo
    const bottomY = p.gapY + PIPE_GAP;
    ctx.fillRect(p.x, bottomY, PIPE_WIDTH, BASE_H - bottomY);
    ctx.strokeRect(p.x, bottomY, PIPE_WIDTH, BASE_H - bottomY);
    ctx.fillRect(p.x - 4, bottomY, PIPE_WIDTH + 8, 18);
    ctx.strokeRect(p.x - 4, bottomY, PIPE_WIDTH + 8, 18);
  });

  // berries coletáveis
  berries.forEach(b => {
    const spriteInfo = berryImgs[b.type];
    if (spriteInfo && spriteInfo.ready) {
      ctx.drawImage(spriteInfo.img, b.x - BERRY_SIZE / 2, b.y - BERRY_SIZE / 2, BERRY_SIZE, BERRY_SIZE);
    } else {
      drawBerryFallback(b);
    }
    drawBerryBubble(b);
  });

  drawShieldGlow();

  // Pidgey — desenho vetorial padrão (só usado quando não há sprite/gif
  // customizado configurado; ver loadBirdSprite() e updateBirdSpritePosition())
  if (!birdSpriteReady) {
    ctx.save();
    ctx.globalAlpha = getBirdOpacity();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    // corpo
    ctx.fillStyle = '#C9A66B';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI*2); ctx.fill();
    // barriga
    ctx.fillStyle = '#F5E6C8';
    ctx.beginPath(); ctx.ellipse(-2, 3, 9, 6, 0, 0, Math.PI*2); ctx.fill();
    // asa
    const wingFlap = started ? Math.sin(performance.now() / 60) * 6 : 0;
    ctx.fillStyle = '#A9835A';
    ctx.beginPath();
    ctx.ellipse(-2, wingFlap, 8, 5, 0.3, 0, Math.PI*2);
    ctx.fill();
    // cabeça
    ctx.fillStyle = '#C9A66B';
    ctx.beginPath(); ctx.arc(10, -6, 8, 0, Math.PI*2); ctx.fill();
    // crista
    ctx.fillStyle = '#8B5E3C';
    ctx.beginPath();
    ctx.moveTo(8, -13); ctx.lineTo(11, -20); ctx.lineTo(13, -12);
    ctx.fill();
    // olho
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(13, -7, 1.8, 0, Math.PI*2); ctx.fill();
    // bico
    ctx.fillStyle = '#E8A93C';
    ctx.beginPath();
    ctx.moveTo(17, -5); ctx.lineTo(24, -3); ctx.lineTo(17, -1);
    ctx.fill();
    ctx.restore();
  } else {
    updateBirdSpritePosition();
  }

  // popups de feedback ("+10", "Protegido!" etc)
  popups.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / 0.9);
    ctx.fillStyle = p.color || '#1a1a1a';
    ctx.font = "800 16px 'Nunito', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  });

  // efeito de bolha de sabão estourando (ver spawnBubblePop/collectBerry)
  bubblePops.forEach(p => {
    const t = 1 - p.life / BUBBLE_POP_LIFE; // 0 → 1
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius * (1 + t * 0.9), 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    p.fragments.forEach(f => {
      const r = Math.max(0, f.r * (1 - t));
      if (r <= 0) return;
      ctx.beginPath();
      ctx.arc(p.x + f.x, p.y + f.y, r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  });

}


async function triggerGameOver() {
  if (gameOver) return;
  gameOver = true;
  cancelAnimationFrame(rafId);
  document.getElementById('gf-final-score').textContent = score;
  document.getElementById('gf-overlay').classList.add('show');
  await gSaveScore('flapidgey', score, user);
  refreshLeaderboard();
  refreshBest();
}

function loop(ts) {
  if (gameOver) return;
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.033, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  draw();
  rafId = requestAnimationFrame(loop);
}

// ── Compartilhar resultado no Stories ──────────────────────
// Desenha um card de resultado no formato de story (1080×1920), guarda
// como imagem pendente em sessionStorage sob a chave
// 'pg_pending_story_image' e sai do jogo direto pro index.html do
// PokéGram — que lê essa chave no boot (checkPendingGameShare) e já
// abre o editor de story com essa imagem carregada.
function buildResultCanvas(useSprite = true) {
  const W = 1080, H = 1920;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const c2 = c.getContext('2d');

  // fundo — mesmo gradiente de céu do jogo
  const bg = c2.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#8fc8f7');
  bg.addColorStop(1, '#c9e8ff');
  c2.fillStyle = bg;
  c2.fillRect(0, 0, W, H);

  // nuvens decorativas
  c2.fillStyle = 'rgba(255,255,255,0.6)';
  [[160, 260, 70], [820, 420, 95], [420, 160, 55], [700, 1500, 80], [220, 1650, 60]].forEach(([x, y, r]) => {
    c2.beginPath(); c2.arc(x, y, r, 0, Math.PI * 2); c2.fill();
  });

  // título
  c2.textAlign = 'center';
  c2.fillStyle = '#b71c1c';
  c2.font = "800 74px 'Cinzel', serif";
  c2.fillText('flaPidgey', W / 2, 320);

  // pidgey (sprite atual, se carregado; senão desenho vetorial simples)
  const birdY = 620, birdSize = 260;
  c2.save();
  if (useSprite && birdSpriteReady && birdSpriteEl.complete) {
    c2.drawImage(birdSpriteEl, W / 2 - birdSize / 2, birdY - birdSize / 2, birdSize, birdSize);
  } else {
    c2.translate(W / 2, birdY);
    c2.scale(9, 9);
    c2.fillStyle = '#C9A66B';
    c2.beginPath(); c2.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2); c2.fill();
    c2.fillStyle = '#F5E6C8';
    c2.beginPath(); c2.ellipse(-2, 3, 9, 6, 0, 0, Math.PI * 2); c2.fill();
    c2.fillStyle = '#C9A66B';
    c2.beginPath(); c2.arc(10, -6, 8, 0, Math.PI * 2); c2.fill();
    c2.fillStyle = '#8B5E3C';
    c2.beginPath(); c2.moveTo(8, -13); c2.lineTo(11, -20); c2.lineTo(13, -12); c2.fill();
    c2.fillStyle = '#1a1a1a';
    c2.beginPath(); c2.arc(13, -7, 1.8, 0, Math.PI * 2); c2.fill();
    c2.fillStyle = '#E8A93C';
    c2.beginPath(); c2.moveTo(17, -5); c2.lineTo(24, -3); c2.lineTo(17, -1); c2.fill();
  }
  c2.restore();

  // pontuação
  c2.fillStyle = 'rgba(255,255,255,.88)';
  const cardW = 760, cardH = 260, cardX = (W - cardW) / 2, cardY = 940;
  c2.beginPath();
  c2.roundRect ? c2.roundRect(cardX, cardY, cardW, cardH, 28) : c2.rect(cardX, cardY, cardW, cardH);
  c2.fill();

  c2.fillStyle = '#6b7280';
  c2.font = "800 34px 'Nunito', sans-serif";
  c2.fillText('PONTOS', W / 2, cardY + 70);

  c2.fillStyle = '#b71c1c';
  c2.font = "800 130px 'Cinzel', serif";
  c2.fillText(String(score), W / 2, cardY + 210);

  // recorde, se houver
  if (best) {
    c2.fillStyle = 'rgba(255,255,255,.82)';
    c2.font = "700 40px 'Nunito', sans-serif";
    c2.fillText(`Recorde: ${best}`, W / 2, cardY + cardH + 90);
  }

  // chamada pra ação — "Eu fiz X pontos, venha jogar flaPidgey também"
  c2.fillStyle = '#fff';
  c2.font = "800 56px 'Nunito', sans-serif";
  c2.shadowColor = 'rgba(0,0,0,.35)';
  c2.shadowBlur = 10;
  c2.shadowOffsetY = 2;
  const ctaLines = wrapCanvasText(c2, `Eu fiz ${score} pontos, venha jogar flaPidgey também!`, W - 140);
  const ctaLineHeight = 68;
  let ctaY = cardY + cardH + (best ? 200 : 140);
  ctaLines.forEach(line => { c2.fillText(line, W / 2, ctaY); ctaY += ctaLineHeight; });
  c2.shadowColor = 'transparent';
  c2.shadowBlur = 0;
  c2.shadowOffsetY = 0;

  return c;
}

// Quebra `text` em linhas que caibam em `maxWidth` no contexto/fonte atuais
// (ctx.font já deve estar setado antes de chamar). Retorna array de linhas.
function wrapCanvasText(ctx2d, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let current = '';
  words.forEach(word => {
    const test = current ? `${current} ${word}` : word;
    if (ctx2d.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });
  if (current) lines.push(current);
  return lines;
}

function shareResultToStories() {
  let dataUrl = null;
  try {
    dataUrl = buildResultCanvas(true).toDataURL('image/png');
  } catch (e) {
    // Canvas "tainted" por causa do sprite (imagem de outro domínio sem
    // CORS liberado) — tenta de novo sem desenhar o sprite, usando o
    // desenho vetorial, que nunca gera esse problema.
    console.warn('[shareResultToStories] toDataURL falhou com sprite, tentando sem sprite', e);
    try {
      dataUrl = buildResultCanvas(false).toDataURL('image/png');
    } catch (e2) {
      console.warn('[shareResultToStories] falhou ao gerar imagem do resultado mesmo sem sprite', e2);
    }
  }
  if (dataUrl) {
    try {
      sessionStorage.setItem('pg_pending_story_image', JSON.stringify({
        image: dataUrl,
        gameLink: '/jogos/flapidgey'
      }));
    } catch (e) {
      console.warn('[shareResultToStories] falhou ao guardar imagem no sessionStorage', e);
    }
  }
  window.location.href = '/';
}


// ── Sizing responsivo (canvas lógico se adapta à proporção da tela,
// escala visual via CSS) ──
let baseSized = false;

function computeBaseDims(maxW, maxH) {
  // O canvas lógico passa a ocupar exatamente a área disponível (largura
  // e altura), então não sobra faixa cinza nem em telas estreitas (celular)
  // nem em telas largas (desktop). Só roda antes do jogo começar pra não
  // distorcer uma partida em andamento.
  BASE_W = Math.max(BASE_W_MIN, Math.round(maxW));
  BASE_H = Math.max(BASE_H_MIN, Math.round(maxH));
}

function resize() {
  const nav = document.querySelector('.gf-nav');
  const navH = nav ? nav.getBoundingClientRect().height : 52;

  // window.innerWidth/innerHeight refletem o viewport visual real (o
  // mesmo que o 100dvh do CSS persegue), então são a fonte confiável do
  // tamanho de tela "que está sendo exibido" no momento da chamada —
  // inclusive depois que a barra de endereço do navegador mobile
  // esconde/aparece.
  const maxW = window.innerWidth;
  const maxH = window.innerHeight - navH;

  // Só trava o recálculo enquanto o pidgey está em pleno voo (started
  // && !gameOver): nesse momento redimensionar o canvas lógico
  // distorceria canos/posição do pássaro em andamento. Antes de começar
  // OU depois de morrer (tela de "Jogar novamente") é seguro — e
  // necessário — recalcular, senão o jogo fica preso no tamanho medido
  // no primeiro boot pra sempre, mesmo que a tela realmente disponível
  // mude (rotação, barra de endereço, fullscreen, etc).
  const midFlight = started && !gameOver;
  const prevW = BASE_W, prevH = BASE_H;
  if (!baseSized || !midFlight) {
    computeBaseDims(maxW, maxH);
    baseSized = true;
  }
  const dimsChanged = BASE_W !== prevW || BASE_H !== prevH;
  // Se o tamanho mudou fora de uma partida em andamento, o pidgey (e o
  // spawn dos canos) precisam ser recentralizados no novo canvas — senão
  // ele fica com a posição calculada pro tamanho antigo, podendo sobrar
  // fora da área visível (ex.: y calculado pra uma tela maior, agora
  // maior que a altura real do canvas novo, menor).
  if (dimsChanged && !midFlight && bird && !started) {
    bird.y = BASE_H / 2;
    bird.vy = 0;
    bird.rot = 0;
  }

  // Escala sempre 1:1 — o canvas lógico já é do tamanho exato da área
  // disponível, então não precisa reduzir/ampliar via CSS.
  scale = 1;
  // Só reatribui width/height se realmente mudou: setar canvas.width/height
  // sempre limpa o desenho atual, então fazer isso à toa (ex.: em eventos
  // de resize espúrios disparados pela troca pra fullscreen no meio de uma
  // partida) apagava o pidgey por um frame.
  const sizeChanged = canvas.width !== BASE_W || canvas.height !== BASE_H;
  if (sizeChanged) {
    canvas.width = BASE_W; canvas.height = BASE_H;
  }
  canvas.style.width = BASE_W + 'px';
  canvas.style.height = BASE_H + 'px';

  if (birdSpriteReady) {
    birdSpriteEl.style.width = BIRD_SPRITE_SIZE * scale + 'px';
    birdSpriteEl.style.height = BIRD_SPRITE_SIZE * scale + 'px';
    updateBirdSpritePosition();
  }

  // Fora de uma partida em andamento não há loop de animação rodando
  // (rAF só existe entre resetGame() e o game over), então se o
  // redimensionamento limpou o canvas (sizeChanged) é preciso repintar
  // manualmente — senão o pidgey/fundo somem até o próximo "Jogar
  // novamente".
  if (!midFlight && sizeChanged && bird) draw();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
document.addEventListener('fullscreenchange', () => setTimeout(resize, 150));
// Barra de endereço/teclado mobile mudam o viewport visual sem
// necessariamente disparar 'resize' na window a tempo — visualViewport
// captura isso de forma mais confiável em navegadores que o suportam.
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
}
// No boot, o innerHeight pode não refletir ainda o valor final (barra de
// endereço do mobile recolhendo, fontes carregando e mudando a altura do
// nav, etc.), então recalcula de novo logo após o load e mais uma vez
// pouco depois, garantindo que o jogo se adapte ao tamanho real da tela
// mesmo quando o boot inicial mediu errado.
window.addEventListener('load', () => resize());
setTimeout(resize, 300);

// ── Ranking ────────────────────────────────────────────
async function refreshLeaderboard() {
  const el = document.getElementById('gf-leaderboard');
  const top = await gLoadTopScores('flapidgey', 5);
  if (top.length === 0) {
    el.innerHTML = '<div class="gf-lb-empty">Nenhum recorde ainda.</div>';
    return;
  }
  el.innerHTML = top.map((row, i) => `
    <div class="gf-lb-row">
      <span class="gf-lb-pos">${i+1}º</span>
      <span class="gf-lb-name">${gEsc(row.author_name || '???')}</span>
      <span class="gf-lb-score">${row.score}</span>
    </div>`).join('');
}

async function refreshBest() {
  if (!user) return;
  best = await gLoadMyBest('flapidgey', user.id);
  document.getElementById('gf-best').textContent = best || '–';
}

// ── Boot ─────────────────────────────────────────────────
function tryEnterFullscreenNow() {
  try {
    const el = document.documentElement;
    if (document.fullscreenElement || !el.requestFullscreen || !gIsMobileLike()) return;
    el.requestFullscreen().catch(() => {}); // sem gesto de usuário disponível: ignora, cai no fallback do 1º toque
  } catch (e) {}
}

(async function boot() {
  user = await gRequireSession();
  if (!user) return;
  tryEnterFullscreenNow();
  gSetupFullscreenOnFirstInteraction();
  resize();
  resetGame();
  loadBirdSprite();
  refreshBest();
})();
</script>
