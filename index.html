<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéGram</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========================
     AUTH SCREEN
========================= -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-wrap">

    <!-- Card Login -->
    <div class="auth-card">
      <div class="auth-logo">
        <div class="pokeball-logo">
          <div class="pb-top"></div>
          <div class="pb-band"><div class="pb-btn"></div></div>
          <div class="pb-bottom"></div>
        </div>
        <h1 class="brand-name">PokéGram</h1>
      </div>

      <div id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="Treinador" autocomplete="off">
        <input type="password" id="login-password" placeholder="Senha">
        <button class="btn-primary" onclick="doLogin()">Entrar</button>
        <div class="or-divider"><span>OU</span></div>
        <button class="btn-google" onclick="doLogin()">
          <span>⚡</span> Entrar com Conta Pokémon
        </button>
        <p class="auth-hint">Demo: <strong>ash</strong> / <strong>pikachu</strong></p>
      </div>

      <div id="register-form" class="auth-form hidden">
        <input type="text" id="reg-name" placeholder="Nome do Treinador">
        <input type="text" id="reg-username" placeholder="@usuário">
        <input type="password" id="reg-password" placeholder="Senha">
        <select id="reg-starter">
          <option value="">Escolha seu Pokémon inicial</option>
          <option value="🌿 Bulbasaur">🌿 Bulbasaur</option>
          <option value="🔥 Charmander">🔥 Charmander</option>
          <option value="💧 Squirtle">💧 Squirtle</option>
          <option value="⚡ Pikachu">⚡ Pikachu</option>
          <option value="🌸 Clefairy">🌸 Clefairy</option>
          <option value="👻 Gengar">👻 Gengar</option>
        </select>
        <button class="btn-primary" onclick="doRegister()">Cadastre-se</button>
      </div>
    </div>

    <!-- Card switch -->
    <div class="auth-card auth-switch-card">
      <div id="login-switch">
        Não tem uma conta? <a href="#" onclick="showRegister()">Cadastre-se</a>
      </div>
      <div id="register-switch" class="hidden">
        Já tem uma conta? <a href="#" onclick="showLogin()">Entre</a>
      </div>
    </div>

    <!-- App promo -->
    <div class="auth-app-row">
      <p>Baixe o aplicativo</p>
      <div class="app-badges">
        <span>App Store</span>
        <span>Google Play</span>
      </div>
    </div>
  </div>
</div>


<!-- ========================
     MAIN APP
========================= -->
<div id="app" class="hidden">

  <!-- SIDEBAR (desktop) -->
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-logo">
      <span class="brand-name-sm">PokéGram</span>
    </div>

    <ul class="sidebar-nav">
      <li>
        <button class="sn-item active" id="btn-feed" onclick="showView('feed')">
          <svg class="sn-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
          <span>Início</span>
        </button>
      </li>
      <li>
        <button class="sn-item" id="btn-explore" onclick="showView('explore')">
          <svg class="sn-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Explorar</span>
        </button>
      </li>
      <li>
        <button class="sn-item" onclick="showNewPost()">
          <svg class="sn-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <span>Criar</span>
        </button>
      </li>
      <li>
        <button class="sn-item" id="btn-profile" onclick="showView('profile')">
          <div class="sn-avatar" id="sn-avatar"></div>
          <span>Perfil</span>
        </button>
      </li>
    </ul>

    <div class="sidebar-bottom">
      <button class="sn-item sn-logout" onclick="doLogout()">
        <svg class="sn-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sair</span>
      </button>
    </div>
  </nav>

  <!-- BOTTOM NAV (mobile) -->
  <nav class="bottom-nav">
    <button class="bn-item active" id="bn-feed" onclick="showView('feed')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
    </button>
    <button class="bn-item" id="bn-explore" onclick="showView('explore')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="bn-item bn-create" onclick="showNewPost()">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </button>
    <button class="bn-item" id="bn-profile" onclick="showView('profile')">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </nav>

  <!-- MAIN -->
  <main class="main-content">

    <!-- FEED -->
    <div id="view-feed" class="view">
      <!-- Mobile topbar -->
      <div class="mobile-topbar">
        <span class="brand-name-sm">PokéGram</span>
        <div class="topbar-actions">
          <button onclick="showNewPost()">
            <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          </button>
        </div>
      </div>

      <div class="feed-layout">
        <!-- Feed center -->
        <div class="feed-center">
          <div class="stories-row" id="stories-row">
            <div class="story-item story-mine" onclick="showNewPost()">
              <div class="story-ring story-ring-add">
                <div class="story-pic" id="my-story-pic"></div>
                <div class="story-plus">+</div>
              </div>
              <span>Seu story</span>
            </div>
            <div id="stories-list"></div>
          </div>
          <div id="feed-posts"></div>
        </div>

        <!-- Suggestions (desktop) -->
        <aside class="feed-aside">
          <div id="aside-profile-mini"></div>
          <div class="suggestions-box">
            <div class="suggestions-title">
              <span>Sugestões para você</span>
              <a href="#" onclick="showView('explore'); return false;">Ver tudo</a>
            </div>
            <div id="suggestions-list"></div>
          </div>
        </aside>
      </div>
    </div>

    <!-- EXPLORE -->
    <div id="view-explore" class="view hidden">
      <div class="explore-top">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" class="search-ic"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Buscar treinadores, #tags..." oninput="doSearch(this.value)">
        </div>
      </div>
      <div id="explore-grid" class="explore-grid"></div>
    </div>

    <!-- PROFILE -->
    <div id="view-profile" class="view hidden">
      <div id="profile-content"></div>
    </div>

    <!-- USER PROFILE -->
    <div id="view-user" class="view hidden">
      <button class="back-btn" onclick="history.back ? goBack() : showView('feed')">
        <svg viewBox="0 0 24 24" width="20" height="20"><polyline points="15,18 9,12 15,6"/></svg> Voltar
      </button>
      <div id="user-profile-content"></div>
    </div>

  </main>
</div>


<!-- NEW POST MODAL -->
<div id="modal-post" class="modal hidden">
  <div class="modal-backdrop" onclick="closeModal('modal-post')"></div>
  <div class="modal-box">
    <div class="modal-header">
      <button class="modal-x" onclick="closeModal('modal-post')">✕</button>
      <h3>Nova publicação</h3>
      <button class="btn-share-modal" onclick="submitPost()">Compartilhar</button>
    </div>
    <div class="post-modal-body">
      <div class="post-img-area" id="post-image-area">
        <div id="emoji-bg-picker" class="emoji-picker-grid"></div>
      </div>
      <div class="post-caption-side">
        <div id="post-author-row" class="post-author-row"></div>
        <textarea id="post-caption" placeholder="Escreva uma legenda... Use #tags!" maxlength="200"></textarea>
        <div class="post-fields">
          <div class="pf-row">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <input type="text" id="post-location" placeholder="Adicionar local (ex: Pallet Town)">
          </div>
          <div class="pf-row">
            <span style="font-size:15px">🎮</span>
            <select id="post-pokemon"><option value="">Pokémon em destaque</option></select>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- COMMENTS MODAL -->
<div id="modal-comments" class="modal hidden">
  <div class="modal-backdrop" onclick="closeModal('modal-comments')"></div>
  <div class="modal-box comments-modal-box">
    <div class="modal-header">
      <button class="modal-x" onclick="closeModal('modal-comments')">✕</button>
      <h3>Comentários</h3>
      <span></span>
    </div>
    <div id="comments-list" class="comments-list"></div>
    <div class="comment-input-bar">
      <div class="comment-avatar-sm" id="my-comment-avatar"></div>
      <input type="text" id="new-comment" placeholder="Adicione um comentário..." maxlength="150">
      <button class="btn-comment-send" onclick="submitComment()">Publicar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
