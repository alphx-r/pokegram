<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pokémon Tetris · Pokégram</title>
<link rel="icon" type="image/x-icon" href="https://64.media.tumblr.com/ebcb74c1a7982e70a9feb6397aaa94cd/8b7e825ce38dd763-27/s1280x1920/dd6884a0d225b480e7cf3d87993f1aa09ee3cbc4.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  html,body{
    margin:0;height:100%;font-family:'Nunito',sans-serif;background:#1a1a2e;color:#1a1a1a;
    overflow:hidden;
  }
  :root{
    --brand:#b71c1c;--brand-mid:#e53935;--accent:#fdd835;--border:#e0e0e0;--muted:#6b7280;
  }
  .gt-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;height:52px;background:var(--brand);
    box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;z-index:20;
  }
  .gt-back{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:13px}
  .gt-back svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .gt-title{font-family:'Cinzel',serif;font-size:15px;color:#fff}
  .gt-title span{color:var(--accent)}

  .gt-stage{
    position:relative;
    width:100%;height:calc(100% - 52px);
    display:flex;align-items:center;justify-content:center;
    background:#1a1a2e;
    touch-action:none;
    overflow:hidden;
  }
  #gt-canvas{
    background:#16162a;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.35);
    touch-action:none;display:block;
  }

  /* HUD flutuante */
  .gt-level-badge{
    position:absolute;top:16px;left:16px;
    width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,0.5);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:19px;color:#1a1a2e;
    z-index:15;pointer-events:none;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
  }
  .gt-next-wrap{
    position:absolute;top:16px;right:16px;
    width:64px;height:64px;border-radius:12px;
    background:rgba(255,255,255,0.15);
    z-index:15;pointer-events:none;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
  }
  #gt-next-canvas{display:block;width:100%;height:100%}

  .gt-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:center;z-index:300;
  }
  .gt-overlay.show{display:flex}
  .gt-modal{
    background:#fff;border-radius:14px;padding:26px 24px;max-width:320px;width:88%;text-align:center;
    max-height:86vh;overflow:auto;
  }
  .gt-modal h2{font-family:'Cinzel',serif;color:var(--brand);margin:0 0 6px;font-size:20px}
  .gt-modal p{color:var(--muted);font-size:13px;margin:0 0 14px}
  .gt-modal .gt-final-score{font-family:'Cinzel',serif;font-size:36px;color:var(--brand-mid);margin-bottom:6px}
  .gt-modal .gt-best-line{font-size:12.5px;color:var(--muted);margin-bottom:18px}
  .gt-modal .gt-best-line b{color:var(--brand)}
  .gt-panel-title{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px;text-align:left}
  .gt-leaderboard-box{text-align:left;margin-bottom:18px}
  .gt-lb-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12.5px}
  .gt-lb-pos{width:16px;font-weight:800;color:var(--brand-mid)}
  .gt-lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gt-lb-score{font-weight:800}
  .gt-lb-empty{font-size:11.5px;color:var(--muted);font-style:italic}
  .gt-btn{
    padding:11px 22px;border:none;border-radius:8px;background:var(--brand-mid);color:#fff;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;cursor:pointer;width:100%;
  }
  .gt-btn:hover{background:var(--brand)}
</style>
</head>
<body>

<nav class="gt-nav">
  <a class="gt-back" href="jogos.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Jogos
  </a>
  <div class="gt-title">Pokémon <span>Tetris</span></div>
  <div style="width:56px"></div>
</nav>

<div class="gt-stage" id="gt-stage">
  <canvas id="gt-canvas"></canvas>
  <div class="gt-level-badge" id="gt-level-badge">1</div>
  <div class="gt-next-wrap"><canvas id="gt-next-canvas" width="64" height="64"></canvas></div>
</div>

<div class="gt-overlay" id="gt-overlay">
  <div class="gt-modal">
    <h2>Game Over!</h2>
    <p>Sua pontuação foi registrada no ranking.</p>
    <div class="gt-final-score" id="gt-final-score">0</div>
    <div class="gt-best-line">Seu recorde: <b id="gt-best">–</b></div>
    <div class="gt-leaderboard-box">
      <div class="gt-panel-title">Top treinadores</div>
      <div id="gt-leaderboard"><div class="gt-lb-empty">Carregando...</div></div>
    </div>
    <button class="gt-btn" id="gt-restart-btn">Jogar novamente</button>
  </div>
</div>

<script src="games-common.js"></script>
<script>
// ════════════════════════════════════════════════════════
// PÓKEMON TETRIS — engine clássico com skin temática
// ════════════════════════════════════════════════════════

const COLS = 10, ROWS = 20;
let CELL = 26; // recalculado em resize()

const stage = document.getElementById('gt-stage');
const canvas = document.getElementById('gt-canvas');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('gt-next-canvas');
const nextCtx = nextCanvas.getContext('2d');
const levelBadge = document.getElementById('gt-level-badge');

// Peças temáticas: cada tipo de Pokémon vira uma cor de peça
const PIECES = {
  I: { shape: [[1,1,1,1]], color: '#78C850' /* grass */ },
  O: { shape: [[1,1],[1,1]], color: '#F8D030' /* electric */ },
  T: { shape: [[0,1,0],[1,1,1]], color: '#A040A0' /* poison */ },
  S: { shape: [[0,1,1],[1,1,0]], color: '#EE8130' /* fire-ish */ },
  Z: { shape: [[1,1,0],[0,1,1]], color: '#C03028' /* fighting/fire */ },
  J: { shape: [[1,0,0],[1,1,1]], color: '#6890F0' /* water */ },
  L: { shape: [[0,0,1],[1,1,1]], color: '#E0C068' /* ground */ },
};
const PIECE_KEYS = Object.keys(PIECES);

let board, current, next, score, level, linesCleared, gameOver, dropInterval, lastDrop, rafId;
let user = null;

function emptyBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

function randomPiece() {
  const key = PIECE_KEYS[Math.floor(Math.random() * PIECE_KEYS.length)];
  const p = PIECES[key];
  return {
    shape: p.shape.map(r => r.slice()),
    color: p.color,
    row: 0,
    col: Math.floor((COLS - p.shape[0].length) / 2),
  };
}

function rotate(shape) {
  const rows = shape.length, cols = shape[0].length;
  const out = Array.from({length: cols}, () => Array(rows).fill(0));
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      out[c][rows - 1 - r] = shape[r][c];
  return out;
}

function collides(piece, dRow, dCol, shape) {
  shape = shape || piece.shape;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const nr = piece.row + r + dRow;
      const nc = piece.col + c + dCol;
      if (nc < 0 || nc >= COLS || nr >= ROWS) return true;
      if (nr >= 0 && board[nr][nc]) return true;
    }
  }
  return false;
}

function lockPiece() {
  current.shape.forEach((r, ri) => r.forEach((v, ci) => {
    if (v) {
      const rr = current.row + ri, cc = current.col + ci;
      if (rr >= 0) board[rr][cc] = current.color;
    }
  }));
  clearLines();
  current = next;
  next = randomPiece();
  drawNext();
  if (collides(current, 0, 0)) {
    endGame();
  }
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(cell => cell)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(null));
      cleared++;
      r++;
    }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800][cleared] * level;
    score += points;
    linesCleared += cleared;
    level = 1 + Math.floor(linesCleared / 10);
    dropInterval = Math.max(120, 800 - (level - 1) * 60);
    updateStats();
  }
}

function updateStats() {
  levelBadge.textContent = level;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // grid de fundo
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(COLS * CELL, r * CELL); ctx.stroke();
  }
  // board fixo
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c]) drawCell(ctx, c, r, board[r][c]);
  // peça atual
  current.shape.forEach((row, ri) => row.forEach((v, ci) => {
    if (v && current.row + ri >= 0) drawCell(ctx, current.col + ci, current.row + ri, current.color);
  }));
}

function drawCell(context, col, row, color) {
  const x = col * CELL, y = row * CELL;
  context.fillStyle = color;
  context.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
  context.fillStyle = 'rgba(255,255,255,0.25)';
  context.fillRect(x + 1, y + 1, CELL - 2, 4);
  context.fillStyle = 'rgba(0,0,0,0.18)';
  context.fillRect(x + 1, y + CELL - 5, CELL - 2, 4);
}

function drawNext() {
  nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  const size = 12;
  const shape = next.shape;
  const w = shape[0].length * size, h = shape.length * size;
  const ox = (nextCanvas.width - w) / 2, oy = (nextCanvas.height - h) / 2;
  shape.forEach((row, ri) => row.forEach((v, ci) => {
    if (!v) return;
    nextCtx.fillStyle = next.color;
    nextCtx.fillRect(ox + ci * size + 1, oy + ri * size + 1, size - 2, size - 2);
  }));
}

function tryMove(dRow, dCol) {
  if (gameOver) return;
  if (!collides(current, dRow, dCol)) {
    current.row += dRow;
    current.col += dCol;
    draw();
    return true;
  }
  if (dRow > 0) lockPiece();
  draw();
  return false;
}

function tryRotate() {
  if (gameOver) return;
  const rotated = rotate(current.shape);
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks) {
    if (!collides(current, 0, k, rotated)) {
      current.shape = rotated;
      current.col += k;
      draw();
      return;
    }
  }
}

function loop(ts) {
  if (gameOver) return;
  if (!lastDrop) lastDrop = ts;
  const interval = fastDropActive ? Math.min(dropInterval, 55) : dropInterval;
  if (ts - lastDrop > interval) {
    tryMove(1, 0);
    lastDrop = ts;
  }
  rafId = requestAnimationFrame(loop);
}

async function endGame() {
  gameOver = true;
  cancelAnimationFrame(rafId);
  document.getElementById('gt-final-score').textContent = score;
  document.getElementById('gt-overlay').classList.add('show');
  await gSaveScore('tetris', score, user);
  refreshLeaderboard();
  refreshBest();
}

function startGame() {
  board = emptyBoard();
  current = randomPiece();
  next = randomPiece();
  score = 0; level = 1; linesCleared = 0; gameOver = false;
  dropInterval = 800; lastDrop = 0; fastDropActive = false;
  updateStats();
  drawNext();
  draw();
  document.getElementById('gt-overlay').classList.remove('show');
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

// ── Controles: teclado ──────────────────────────────────
let fastDropActive = false;

document.addEventListener('keydown', (e) => {
  if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
  if (gameOver) return;
  if (e.key === 'ArrowLeft') tryMove(0, -1);
  else if (e.key === 'ArrowRight') tryMove(0, 1);
  else if (e.key === 'ArrowDown') fastDropActive = true;
  else if (e.key === ' ') tryRotate();
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowDown') fastDropActive = false;
});

// ── Controles: touch (arrastar move, tocar gira, segurar acelera) ──
let touchActive = false;
let touchStartX = 0, touchStartY = 0, touchOriginX = 0, touchStartTime = 0;
let touchDragged = false;
let holdTimer = null;
const TAP_THRESHOLD = 12;      // px de tolerância para considerar "toque"
const TAP_TIME_LIMIT = 220;    // ms de tolerância para considerar "toque"
const HOLD_DELAY = 180;        // ms segurando parado até acelerar descida

function cellPx() { return CELL; }

stage.addEventListener('touchstart', (e) => {
  if (gameOver) return;
  const t = e.touches[0];
  touchActive = true;
  touchDragged = false;
  touchStartX = touchOriginX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => {
    if (touchActive && !touchDragged) fastDropActive = true;
  }, HOLD_DELAY);
}, {passive:true});

stage.addEventListener('touchmove', (e) => {
  if (gameOver || !touchActive) return;
  const t = e.touches[0];
  const dx = t.clientX - touchOriginX;
  const dyTotal = Math.abs(t.clientY - touchStartY);
  const dxTotal = Math.abs(t.clientX - touchStartX);
  if (dxTotal > TAP_THRESHOLD || dyTotal > TAP_THRESHOLD) {
    touchDragged = true;
    fastDropActive = false;
  }
  const step = cellPx();
  if (Math.abs(dx) >= step) {
    const cells = Math.trunc(dx / step);
    tryMove(0, cells);
    touchOriginX += cells * step;
  }
}, {passive:true});

function touchEndHandler(e) {
  if (!touchActive) return;
  touchActive = false;
  fastDropActive = false;
  clearTimeout(holdTimer);
  const elapsed = Date.now() - touchStartTime;
  if (!touchDragged && elapsed < TAP_TIME_LIMIT && !gameOver) {
    tryRotate();
  }
}
stage.addEventListener('touchend', touchEndHandler);
stage.addEventListener('touchcancel', touchEndHandler);

document.getElementById('gt-restart-btn').addEventListener('click', startGame);

// ── Canvas sizing responsivo (ocupa toda a área disponível) ──
function resize() {
  const pad = 24;
  const maxH = stage.clientHeight - pad;
  const maxW = stage.clientWidth - pad;
  CELL = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
  CELL = Math.max(12, Math.min(CELL, 46));
  canvas.width = CELL * COLS;
  canvas.height = CELL * ROWS;
  if (board) draw();
}
window.addEventListener('resize', resize);

// ── Ranking (exibido apenas na tela de Game Over) ─────────
async function refreshLeaderboard() {
  const el = document.getElementById('gt-leaderboard');
  const top = await gLoadTopScores('tetris', 5);
  if (top.length === 0) {
    el.innerHTML = '<div class="gt-lb-empty">Nenhum recorde ainda.</div>';
    return;
  }
  el.innerHTML = top.map((row, i) => `
    <div class="gt-lb-row">
      <span class="gt-lb-pos">${i+1}º</span>
      <span class="gt-lb-name">${gEsc(row.author_name || '???')}</span>
      <span class="gt-lb-score">${row.score}</span>
    </div>`).join('');
}

async function refreshBest() {
  if (!user) return;
  const best = await gLoadMyBest('tetris', user.id);
  document.getElementById('gt-best').textContent = best || '–';
}

// ── Boot ──────────────────────────────────────────────────
(async function boot() {
  user = await gRequireSession();
  if (!user) return;
  gSetupFullscreenOnFirstInteraction();
  resize();
  startGame();
})();
</script>
</body>
</html>
