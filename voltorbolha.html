<script src="/games-common.js"></script>
<script>
// ════════════════════════════════════════════════════════
// VOLTORBOLHA — bubble shooter com os 20 tipos de Pokémon
// (os 18 canônicos + Light e Scent, homebrew do RPG)
// ════════════════════════════════════════════════════════

const canvas = document.getElementById('vb-canvas');
const ctx = canvas.getContext('2d');

// ── Tipos ────────────────────────────────────────────────
// Ícones dos 18 canônicos vêm do repo partywhale/pokemon-type-icons
// (mesmo usado no nationaldex.html); Light e Scent são homebrew e
// vêm do Storage do Supabase do Kingdom Platinum (mesmo lugar de onde
// o nationaldex.html busca os SVGs customizados desses dois tipos).
const KP_SUPA_URL = 'https://vnccljhhexlsthjaaorr.supabase.co';
const CUSTOM_TYPE_ICONS = new Set(['light', 'scent']);
function typeIconSrc(t) {
  return CUSTOM_TYPE_ICONS.has(t)
    ? `${KP_SUPA_URL}/storage/v1/object/public/pokemons/types/${t}.svg`
    : `https://cdn.jsdelivr.net/gh/partywhale/pokemon-type-icons@main/icons/${t}.svg`;
}

// Cores extraídas diretamente do círculo de fundo de cada SVG oficial
// (partywhale/pokemon-type-icons) — mantidas aqui só como fallback
// (usadas antes do ícone carregar); quando o ícone já carregou, a bola
// usa o próprio círculo do SVG, então essas cores ficam idênticas ao
// que é desenhado (ver drawBall).
const TYPES = [
  { key: 'normal',   bg: '#828282' }, { key: 'fire',     bg: '#e4613e' },
  { key: 'water',    bg: '#3099e1' }, { key: 'electric', bg: '#dfbc28' },
  { key: 'grass',    bg: '#439837' }, { key: 'ice',      bg: '#47c8c8' },
  { key: 'fighting', bg: '#e49021' }, { key: 'poison',   bg: '#9354cb' },
  { key: 'ground',   bg: '#a4733c' }, { key: 'flying',   bg: '#74aad0' },
  { key: 'psychic',  bg: '#e96c8c' }, { key: 'bug',      bg: '#9f9f28' },
  { key: 'rock',     bg: '#a9a481' }, { key: 'ghost',    bg: '#6f4570' },
  { key: 'dragon',   bg: '#576fbc' }, { key: 'dark',     bg: '#4f4747' },
  { key: 'steel',    bg: '#74b0cb' }, { key: 'fairy',    bg: '#e18ce1' },
  { key: 'light',    bg: '#e5d38a' }, { key: 'scent',    bg: '#3cc492' },
];
const TYPE_ICONS = {}; // key -> { img, ready }
TYPES.forEach(t => {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  TYPE_ICONS[t.key] = { img, ready: false };
  img.onload = () => { TYPE_ICONS[t.key].ready = true; if (t.key === nextType) updateNextBallUI(); };
  img.onerror = () => { TYPE_ICONS[t.key].ready = false; };
  img.src = typeIconSrc(t.key);
});

// Quantos tipos entram no sorteio, crescendo conforme a pontuação —
// jogar com os 20 de cara tornaria quase impossível formar trincas.
const ACTIVE_TYPES_START = 5;
const POINTS_PER_NEW_TYPE = 220;
function activeTypeCount() {
  return Math.min(TYPES.length, ACTIVE_TYPES_START + Math.floor(score / POINTS_PER_NEW_TYPE));
}
function randomActiveType() {
  return TYPES[Math.floor(Math.random() * activeTypeCount())].key;
}
function typeInfo(key) { return TYPES.find(t => t.key === key); }

function darken(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((n >> 16) & 255) - amt);
  const g = Math.max(0, ((n >> 8) & 255) - amt);
  const b = Math.max(0, (n & 255) - amt);
  return `rgb(${r},${g},${b})`;
}

function drawBall(targetCtx, x, y, r, type, alpha) {
  const info = typeInfo(type);
  const icon = TYPE_ICONS[type];
  targetCtx.save();
  if (alpha !== undefined) targetCtx.globalAlpha = alpha;

  if (icon && icon.ready) {
    // Cada SVG de tipo já vem com seu próprio círculo de fundo (a cor
    // oficial daquele tipo). Antes desenhávamos um círculo colorido
    // aproximado por baixo e o ícone só cobria 65% dele, sobrando um
    // anel de cor diferente da do SVG. Agora o ícone preenche a bolha
    // inteira, então a cor da bolha é exatamente a cor do SVG.
    targetCtx.save();
    targetCtx.beginPath();
    targetCtx.arc(x, y, r, 0, Math.PI * 2);
    targetCtx.clip();
    targetCtx.drawImage(icon.img, x - r, y - r, r * 2, r * 2);
    targetCtx.restore();
    // brilho sutil por cima
    targetCtx.beginPath();
    targetCtx.ellipse(x - r * 0.32, y - r * 0.35, r * 0.32, r * 0.2, -0.5, 0, Math.PI * 2);
    targetCtx.fillStyle = 'rgba(255,255,255,.35)';
    targetCtx.fill();
    // contorno fino pra separar bolhas vizinhas
    targetCtx.beginPath();
    targetCtx.arc(x, y, r, 0, Math.PI * 2);
    targetCtx.lineWidth = Math.max(1.5, r * 0.09);
    targetCtx.strokeStyle = darken(info.bg, 60);
    targetCtx.stroke();
  } else {
    // Fallback enquanto o SVG ainda não carregou (ou falhou): usa a
    // cor aproximada + inicial da letra, igual antes.
    targetCtx.beginPath();
    targetCtx.arc(x, y, r, 0, Math.PI * 2);
    targetCtx.fillStyle = info.bg;
    targetCtx.fill();
    targetCtx.lineWidth = Math.max(1.5, r * 0.09);
    targetCtx.strokeStyle = darken(info.bg, 60);
    targetCtx.stroke();
    targetCtx.beginPath();
    targetCtx.ellipse(x - r * 0.32, y - r * 0.35, r * 0.32, r * 0.2, -0.5, 0, Math.PI * 2);
    targetCtx.fillStyle = 'rgba(255,255,255,.45)';
    targetCtx.fill();
    targetCtx.fillStyle = darken(info.bg, 90);
    targetCtx.font = `800 ${Math.round(r * 0.9)}px 'Nunito',sans-serif`;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'middle';
    targetCtx.fillText(type[0].toUpperCase(), x, y + 1);
  }
  targetCtx.restore();
}

// Bolinhas do tipo atual orbitando ao redor do canhão (em vez de uma
// única bola tampando o Voltorb). Algumas passam atrás do canhão e
// outras na frente, dependendo do ângulo da órbita naquele instante —
// por isso a função é chamada duas vezes no draw(): uma antes de
// drawVoltorbCannon() (só as de trás) e outra depois (só as da frente).
const ORBIT_COUNT = 5;
const ORBIT_RADIUS_FACTOR = 1.75; // distância do centro do canhão, em raios de bolha
const ORBIT_BALL_R_FACTOR = 0.52; // tamanho de cada bolinha orbitando, em raios de bolha
const ORBIT_SPEED = 0.7; // rad/s

function drawOrbitingBalls(frontLayer) {
  if (!currentType || gameOver) return;
  const orbitR = R * ORBIT_RADIUS_FACTOR;
  const ballR = Math.max(4, R * ORBIT_BALL_R_FACTOR);
  for (let i = 0; i < ORBIT_COUNT; i++) {
    const angle = orbitTime * ORBIT_SPEED + (i / ORBIT_COUNT) * Math.PI * 2;
    // depthFactor > 0 quando a bolinha está "na frente" do canhão
    // (metade de baixo da órbita, mais perto de quem olha).
    const depthFactor = Math.sin(angle);
    const isFront = depthFactor > 0;
    if (isFront !== frontLayer) continue;

    const x = shooterX + Math.cos(angle) * orbitR;
    // achata a órbita verticalmente (elipse) pra dar sensação de
    // profundidade em vez de um círculo reto sobre o canhão.
    const y = shooterY + depthFactor * orbitR * 0.42;
    // bolinhas de trás ficam levemente menores e mais transparentes,
    // reforçando a ideia de estarem mais longe.
    const depthScale = 0.82 + 0.18 * (depthFactor * 0.5 + 0.5);
    const alpha = isFront ? 1 : 0.75;
    drawBall(ctx, x, y, ballR * depthScale, currentType, alpha);
  }
}

// Desenha o canhão como um Voltorb: esfera vermelha em cima / creme
// embaixo, com uma faixa preta no meio e dois "olhos". O cano continua
// existindo (pra deixar claro pra onde a mira aponta) mas agora nasce
// de dentro da bolinha, igual uma antena, e gira junto com aimAngle.
function drawVoltorbCannon() {
  const cx = shooterX, cy = shooterY, rad = R * 0.95;

  // cano de mira, rotaciona com o ângulo
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(aimAngle);
  ctx.fillStyle = '#7a1c1c';
  ctx.fillRect(-R * 0.26, -R * 2.05, R * 0.52, R * 1.35);
  ctx.restore();

  // corpo (esfera vermelha em cima, creme embaixo — clip circular)
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, rad, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = '#e0393a';
  ctx.fillRect(cx - rad, cy - rad, rad * 2, rad);
  ctx.fillStyle = '#f4efe2';
  ctx.fillRect(cx - rad, cy, rad * 2, rad);
  // faixa preta central
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(cx - rad, cy - rad * 0.14, rad * 2, rad * 0.28);
  ctx.restore();

  // contorno
  ctx.beginPath();
  ctx.arc(cx, cy, rad, 0, Math.PI * 2);
  ctx.lineWidth = Math.max(1.5, rad * 0.09);
  ctx.strokeStyle = '#1a1a1a';
  ctx.stroke();

  // olhinhos
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(cx - rad * 0.34, cy - rad * 0.34, rad * 0.11, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + rad * 0.34, cy - rad * 0.34, rad * 0.11, 0, Math.PI * 2); ctx.fill();

  // brilho
  ctx.beginPath();
  ctx.ellipse(cx - rad * 0.36, cy - rad * 0.58, rad * 0.22, rad * 0.13, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fill();
}

// ── Dimensões ────────────────────────────────────────────
const BASE_W_MIN = 280, BASE_H_MIN = 440;
let BASE_W = 320, BASE_H = 520, scale = 1;
const COLS = 8;
const TOTAL_ROWS = 24;      // buffer fixo — jamais chega perto disso (game over acontece bem antes)
const INITIAL_ROWS = 5;
let R = 20, rowHeight = R * Math.sqrt(3);
let shooterX = 160, shooterY = 460, dangerY = 400;

function recomputeMetrics() {
  R = BASE_W / (COLS * 2);
  rowHeight = R * Math.sqrt(3);
  shooterX = BASE_W / 2;
  shooterY = BASE_H - R * 2.4;
  dangerY = shooterY - R * 2.4;
}

// ── Grid (linhas com offset fixo, nunca recalculado por índice —
// evita o grid "trocar de padrão" visualmente quando uma linha nova
// entra no topo e empurra as outras pra baixo) ─────────────
let grid = []; // array de TOTAL_ROWS objetos {offset:0|R, cells:[type|null,...]}

function makeRow(offset) {
  const cols = offset === 0 ? COLS : COLS - 1;
  return { offset, cells: new Array(cols).fill(null) };
}

function initGrid() {
  grid = [];
  for (let i = 0; i < TOTAL_ROWS; i++) grid.push(makeRow(i % 2 === 0 ? 0 : R));
  for (let i = 0; i < INITIAL_ROWS; i++) {
    const row = grid[i];
    for (let c = 0; c < row.cells.length; c++) {
      if (Math.random() < 0.88) row.cells[c] = randomActiveType();
    }
  }
}

function cellCenter(rowIdx, col) {
  const row = grid[rowIdx];
  const x = row.offset === 0 ? R + col * 2 * R : 2 * R + col * 2 * R;
  const y = R + rowIdx * rowHeight;
  return { x, y };
}

// Vizinhos de (rowIdx,col), respeitando o offset fixo de cada linha
// (ver comentário acima de `grid`).
function neighborsOf(rowIdx, col) {
  const row = grid[rowIdx];
  const out = [];
  const push = (r, c) => { if (r >= 0 && r < TOTAL_ROWS && grid[r] && c >= 0 && c < grid[r].cells.length) out.push([r, c]); };
  push(rowIdx, col - 1); push(rowIdx, col + 1);
  if (row.offset === 0) { // linha "longa" — vizinhas de cima/baixo (curtas) em col-1 e col
    push(rowIdx - 1, col - 1); push(rowIdx - 1, col);
    push(rowIdx + 1, col - 1); push(rowIdx + 1, col);
  } else { // linha "curta" — vizinhas de cima/baixo (longas) em col e col+1
    push(rowIdx - 1, col); push(rowIdx - 1, col + 1);
    push(rowIdx + 1, col); push(rowIdx + 1, col + 1);
  }
  return out;
}

function addRowAtTop() {
  const newOffset = grid[0].offset === 0 ? R : 0;
  const row = makeRow(newOffset);
  for (let c = 0; c < row.cells.length; c++) {
    if (Math.random() < 0.85) row.cells[c] = randomActiveType();
  }
  grid.unshift(row);
  grid.pop(); // buffer de tamanho fixo — a última linha está sempre vazia nesse ponto do jogo
  gridAnimRemaining = GRID_ANIM_DURATION;
}

function lowestOccupiedY() {
  for (let r = TOTAL_ROWS - 1; r >= 0; r--) {
    if (grid[r].cells.some(c => c !== null)) return R + r * rowHeight + R;
  }
  return -1;
}

// ── Estado do jogo ───────────────────────────────────────
let score = 0, best = 0, user = null, gameOver = false, started = false;
let aimAngle = 0;
let orbitTime = 0; // acumulado para animar as bolas orbitando o canhão
const AIM_LIMIT = 1.25; // rad (~72°)
const ROTATE_SPEED = 2.6; // rad/s
let keyLeft = false, keyRight = false;
let dragging = false;
let currentType = null, nextType = null;
let projectile = null; // {x,y,vx,vy,type}
const PROJECTILE_SPEED = 620;
let poppingFx = []; // efeitos de estouro {x,y,life,color}
let fallingBalls = []; // bolhas soltas caindo {x,y,vy,type,life}
let shotsSinceRow = 0;
const SHOTS_PER_ROW = 5;
let rafId = null, lastTs = null;

// Animação da linha nova "descendo" no topo do grid em vez de aparecer
// tudo de uma vez: addRowAtTop() já empurra os dados instantaneamente
// (a lógica do jogo — game over, colisão — usa a posição real), mas o
// desenho usa gridAnimRemaining pra deslizar visualmente a linha nova
// (e todas as outras, empurradas junto) de -rowHeight até a posição
// final ao longo de GRID_ANIM_DURATION segundos.
let gridAnimRemaining = 0;
const GRID_ANIM_DURATION = 0.5;

function newBallPair() {
  currentType = randomActiveType();
  nextType = randomActiveType();
  updateNextBallUI();
}

const nextCanvas = document.getElementById('vb-next-canvas');
const nextCtx = nextCanvas.getContext('2d');
function updateNextBallUI() {
  const size = nextCanvas.width;
  nextCtx.clearRect(0, 0, size, size);
  drawBall(nextCtx, size / 2, size / 2, size / 2 - 1.5, nextType);
}

// Esconde o hint de controles assim que o jogador dá o primeiro tiro
// (ou seja, quando o jogo "começa" de verdade) — antes ele ficava na
// tela o jogo inteiro, atrapalhando a mira perto do canhão.
function hideHintOnce() {
  const hint = document.getElementById('vb-hint');
  if (hint) hint.style.display = 'none';
}

function resetGame() {
  document.getElementById('vb-overlay').classList.remove('show');
  score = 0; gameOver = false; started = true;
  aimAngle = 0; projectile = null; poppingFx = []; fallingBalls = []; shotsSinceRow = 0;
  gridAnimRemaining = 0;
  hideHintOnce();
  document.getElementById('vb-score').textContent = '0';
  updateTypesUI();
  initGrid();
  newBallPair();
  lastTs = null;
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function updateTypesUI() {
  document.getElementById('vb-types-count').textContent = `${activeTypeCount()}/${TYPES.length}`;
}

// ── Disparo / física ─────────────────────────────────────
function fire() {
  if (projectile || gameOver || !started) return;
  projectile = {
    x: shooterX, y: shooterY,
    vx: PROJECTILE_SPEED * Math.sin(aimAngle),
    vy: -PROJECTILE_SPEED * Math.cos(aimAngle),
    type: currentType,
  };
  // A bolha que estava marcada como "Próxima" agora vira a bolha atual,
  // e sorteamos uma nova "Próxima" — antes isso nunca acontecia, então
  // o indicador nunca batia com o que de fato saía do canhão.
  currentType = nextType;
  nextType = randomActiveType();
  updateNextBallUI();
  hideHintOnce();
}

function findLandingNearCeiling(x) {
  const row = grid[0];
  const raw = row.offset === 0 ? (x - R) / (2 * R) : (x - 2 * R) / (2 * R);
  let col = Math.round(raw);
  col = Math.max(0, Math.min(row.cells.length - 1, col));
  if (row.cells[col] === null) return [0, col];
  // vizinho livre mais próximo na própria linha
  for (let d = 1; d < row.cells.length; d++) {
    if (col - d >= 0 && row.cells[col - d] === null) return [0, col - d];
    if (col + d < row.cells.length && row.cells[col + d] === null) return [0, col + d];
  }
  return null;
}

function findEmptyNeighborNear(rowIdx, col, x, y) {
  const candidates = neighborsOf(rowIdx, col).filter(([r, c]) => grid[r].cells[c] === null);
  if (candidates.length === 0) {
    // busca em anel: vizinhos dos vizinhos
    const seen = new Set();
    const ring = [];
    neighborsOf(rowIdx, col).forEach(([r, c]) => {
      neighborsOf(r, c).forEach(([r2, c2]) => {
        const key = r2 + '_' + c2;
        if (!seen.has(key) && grid[r2].cells[c2] === null) { seen.add(key); ring.push([r2, c2]); }
      });
    });
    if (ring.length === 0) return null;
    candidates.push(...ring);
  }
  let best = null, bestD = Infinity;
  candidates.forEach(([r, c]) => {
    const p = cellCenter(r, c);
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bestD) { bestD = d; best = [r, c]; }
  });
  return best;
}

function settleProjectile() {
  const p = projectile;
  let landed = null;
  if (p.y <= R) {
    landed = findLandingNearCeiling(p.x);
  } else {
    let hitRow = -1, hitCol = -1, hitD = Infinity;
    for (let r = 0; r < TOTAL_ROWS; r++) {
      const row = grid[r];
      for (let c = 0; c < row.cells.length; c++) {
        if (row.cells[c] === null) continue;
        const cc = cellCenter(r, c);
        const d = (cc.x - p.x) ** 2 + (cc.y - p.y) ** 2;
        if (d < (2 * R - 2) ** 2 && d < hitD) { hitD = d; hitRow = r; hitCol = c; }
      }
    }
    if (hitRow >= 0) landed = findEmptyNeighborNear(hitRow, hitCol, p.x, p.y);
    if (!landed) landed = findLandingNearCeiling(p.x);
  }
  projectile = null;
  if (!landed) return;
  const [lr, lc] = landed;
  grid[lr].cells[lc] = p.type;
  resolveMatches(lr, lc);
  shotsSinceRow++;
  if (shotsSinceRow >= SHOTS_PER_ROW) { shotsSinceRow = 0; addRowAtTop(); }
  checkGameOver();
}

// ── Trincas e queda de bolhas soltas ─────────────────────
function resolveMatches(rowIdx, col) {
  const type = grid[rowIdx].cells[col];
  const seen = new Set([rowIdx + '_' + col]);
  const stack = [[rowIdx, col]];
  const group = [[rowIdx, col]];
  while (stack.length) {
    const [r, c] = stack.pop();
    neighborsOf(r, c).forEach(([nr, nc]) => {
      const key = nr + '_' + nc;
      if (seen.has(key)) return;
      if (grid[nr].cells[nc] === type) {
        seen.add(key); stack.push([nr, nc]); group.push([nr, nc]);
      }
    });
  }
  if (group.length >= 3) {
    group.forEach(([r, c]) => {
      const p = cellCenter(r, c);
      poppingFx.push({ x: p.x, y: p.y, life: 0.3, color: typeInfo(type).bg });
      grid[r].cells[c] = null;
    });
    score += group.length * 15 + Math.max(0, group.length - 3) * 10;
    updateScoreUI();
    dropFloating();
  }
}

function dropFloating() {
  const reached = new Set();
  const stack = [];
  grid[0].cells.forEach((v, c) => { if (v !== null) { reached.add('0_' + c); stack.push([0, c]); } });
  while (stack.length) {
    const [r, c] = stack.pop();
    neighborsOf(r, c).forEach(([nr, nc]) => {
      const key = nr + '_' + nc;
      if (!reached.has(key) && grid[nr].cells[nc] !== null) { reached.add(key); stack.push([nr, nc]); }
    });
  }
  let dropped = 0;
  for (let r = 0; r < TOTAL_ROWS; r++) {
    const row = grid[r];
    for (let c = 0; c < row.cells.length; c++) {
      if (row.cells[c] === null) continue;
      const key = r + '_' + c;
      if (!reached.has(key)) {
        const p = cellCenter(r, c);
        fallingBalls.push({ x: p.x, y: p.y, vy: 60, type: row.cells[c], life: 1.4 });
        row.cells[c] = null;
        dropped++;
      }
    }
  }
  if (dropped > 0) { score += dropped * 25; updateScoreUI(); }
}

function updateScoreUI() {
  document.getElementById('vb-score').textContent = score;
  updateTypesUI();
}

function checkGameOver() {
  const y = lowestOccupiedY();
  if (y >= 0 && y >= dangerY) triggerGameOver();
}

async function triggerGameOver() {
  if (gameOver) return;
  gameOver = true;
  cancelAnimationFrame(rafId);
  document.getElementById('vb-final-score').textContent = score;
  document.getElementById('vb-overlay').classList.add('show');
  await gSaveScore('voltorbolha', score, user);
  refreshLeaderboard();
  refreshBest();
}

// ── Update / desenho ──────────────────────────────────────
function update(dt) {
  orbitTime += dt;
  if (keyLeft) aimAngle = Math.max(-AIM_LIMIT, aimAngle - ROTATE_SPEED * dt);
  if (keyRight) aimAngle = Math.min(AIM_LIMIT, aimAngle + ROTATE_SPEED * dt);

  if (projectile) {
    const p = projectile;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < R) { p.x = R; p.vx = -p.vx; }
    if (p.x > BASE_W - R) { p.x = BASE_W - R; p.vx = -p.vx; }
    if (p.y <= R) { settleProjectile(); }
    else {
      for (let r = 0; r < TOTAL_ROWS && projectile; r++) {
        const row = grid[r];
        for (let c = 0; c < row.cells.length; c++) {
          if (row.cells[c] === null) continue;
          const cc = cellCenter(r, c);
          const d2 = (cc.x - p.x) ** 2 + (cc.y - p.y) ** 2;
          if (d2 < (2 * R - 2) ** 2) { settleProjectile(); break; }
        }
      }
    }
  }

  poppingFx.forEach(f => f.life -= dt);
  poppingFx = poppingFx.filter(f => f.life > 0);

  fallingBalls.forEach(b => { b.vy += 900 * dt; b.y += b.vy * dt; b.life -= dt; });
  fallingBalls = fallingBalls.filter(b => b.life > 0 && b.y < BASE_H + R * 2);

  if (gridAnimRemaining > 0) gridAnimRemaining = Math.max(0, gridAnimRemaining - dt);
}

function computeAimGuide() {
  // linha pontilhada simples até a primeira parede/topo, com um reflexo
  let x = shooterX, y = shooterY;
  let vx = Math.sin(aimAngle), vy = -Math.cos(aimAngle);
  const pts = [[x, y]];
  for (let bounce = 0; bounce < 2; bounce++) {
    let tTop = vy < 0 ? (R - y) / vy : Infinity;
    let tWall = vx > 0 ? (BASE_W - R - x) / vx : (vx < 0 ? (R - x) / vx : Infinity);
    const t = Math.min(tTop, tWall);
    if (!isFinite(t) || t < 0) break;
    x += vx * t; y += vy * t;
    pts.push([x, y]);
    if (t === tTop) break;
    vx = -vx;
  }
  return pts;
}

function draw() {
  ctx.clearRect(0, 0, BASE_W, BASE_H);

  // linha de perigo
  ctx.save();
  ctx.strokeStyle = 'rgba(183,28,28,.35)';
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(0, dangerY); ctx.lineTo(BASE_W, dangerY); ctx.stroke();
  ctx.restore();

  // Enquanto uma linha nova está "descendo" (ver addRowAtTop), desenha
  // todo o grid deslocado pra cima por uma fração de rowHeight que
  // encolhe suavemente até 0 — dá a sensação de as bolhas escorregando
  // pra baixo aos poucos, em vez de saltarem pra posição final de uma vez.
  const gridAnimT = gridAnimRemaining > 0 ? gridAnimRemaining / GRID_ANIM_DURATION : 0;
  const gridOffsetY = -rowHeight * (gridAnimT * gridAnimT * gridAnimT);
  for (let r = 0; r < TOTAL_ROWS; r++) {
    const row = grid[r];
    for (let c = 0; c < row.cells.length; c++) {
      if (row.cells[c] === null) continue;
      const p = cellCenter(r, c);
      const y = p.y + gridOffsetY;
      if (y > BASE_H + R) continue;
      drawBall(ctx, p.x, y, R - 1.2, row.cells[c]);
    }
  }

  poppingFx.forEach(f => {
    const t = 1 - f.life / 0.3;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t);
    ctx.beginPath();
    ctx.arc(f.x, f.y, R * (1 + t * 0.8), 0, Math.PI * 2);
    ctx.strokeStyle = f.color; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  });

  fallingBalls.forEach(b => drawBall(ctx, b.x, b.y, R - 1.2, b.type, Math.min(1, b.life)));

  // canhão — corpo com cara de Voltorb (bolinha vermelha/creme) com um
  // pequeno cano por cima, que gira com a mira igual ao canhão original.
  // As bolinhas do tipo atual orbitam ao redor dele: as de trás são
  // desenhadas antes do canhão, as da frente depois — assim o Voltorb
  // nunca fica tapado.
  drawOrbitingBalls(false); // atrás
  drawVoltorbCannon();
  drawOrbitingBalls(true);  // frente

  if (!gameOver && started) {
    ctx.save();
    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = 'rgba(26,26,26,.32)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const pts = computeAimGuide();
    pts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.stroke();
    ctx.restore();
  }

  if (projectile) drawBall(ctx, projectile.x, projectile.y, R - 1.2, projectile.type);
}

function loop(ts) {
  if (gameOver) return;
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.033, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  draw();
  rafId = requestAnimationFrame(loop);
}

// ── Controles ──────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (gameOver || !started) return;
  if (e.key === 'ArrowLeft') { keyLeft = true; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { keyRight = true; e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); fire(); }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft') keyLeft = false;
  else if (e.key === 'ArrowRight') keyRight = false;
});

function angleFromPointer(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (BASE_W / rect.width);
  const y = (clientY - rect.top) * (BASE_H / rect.height);
  const dx = x - shooterX, dy = shooterY - y;
  let a = Math.atan2(dx, Math.max(1, dy));
  return Math.max(-AIM_LIMIT, Math.min(AIM_LIMIT, a));
}
canvas.addEventListener('pointerdown', (e) => {
  if (gameOver || !started) return;
  e.preventDefault();
  dragging = true;
  aimAngle = angleFromPointer(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  aimAngle = angleFromPointer(e.clientX, e.clientY);
});
window.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  dragging = false;
  if (!gameOver && started) fire();
});

document.getElementById('vb-restart-btn').addEventListener('click', resetGame);
document.getElementById('vb-share-btn').addEventListener('click', shareResultToStories);

// ── HUD (Pontos/Recorde/Tipos): toque oculta, toque no mesmo lugar mostra ──
(function () {
  const hudBox = document.getElementById('vb-hud-box');
  let hidden = false;
  function toggleHud(e) {
    e.stopPropagation();
    e.preventDefault();
    hidden = !hidden;
    hudBox.classList.toggle('vb-hud-hidden', hidden);
  }
  hudBox.addEventListener('pointerdown', toggleHud);
})();

// ── Compartilhar resultado ────────────────────────────────
function buildResultCanvas() {
  const W = 1080, H = 1920;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const c2 = c.getContext('2d');

  const bg = c2.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#fdeeee'); bg.addColorStop(1, '#fff6de');
  c2.fillStyle = bg; c2.fillRect(0, 0, W, H);

  c2.textAlign = 'center';
  c2.fillStyle = '#b71c1c';
  c2.font = "800 74px 'Cinzel', serif";
  c2.fillText('Voltorbolha', W / 2, 320);

  // bolhas decorativas com algumas das cores de tipo já desbloqueadas
  const shown = TYPES.slice(0, activeTypeCount());
  shown.slice(0, 6).forEach((t, i) => {
    const cx = 160 + (i % 3) * 380, cy = 560 + Math.floor(i / 3) * 220;
    c2.beginPath(); c2.arc(cx, cy, 80, 0, Math.PI * 2);
    c2.fillStyle = t.bg; c2.fill();
    c2.lineWidth = 6; c2.strokeStyle = darken(t.bg, 60); c2.stroke();
  });

  c2.fillStyle = 'rgba(255,255,255,.9)';
  const cardW = 760, cardH = 260, cardX = (W - cardW) / 2, cardY = 1080;
  c2.beginPath();
  c2.roundRect ? c2.roundRect(cardX, cardY, cardW, cardH, 28) : c2.rect(cardX, cardY, cardW, cardH);
  c2.fill();

  c2.fillStyle = '#6b7280';
  c2.font = "800 34px 'Nunito', sans-serif";
  c2.fillText('PONTOS', W / 2, cardY + 70);

  c2.fillStyle = '#b71c1c';
  c2.font = "800 130px 'Cinzel', serif";
  c2.fillText(String(score), W / 2, cardY + 210);

  if (best) {
    c2.fillStyle = 'rgba(26,26,26,.7)';
    c2.font = "700 40px 'Nunito', sans-serif";
    c2.fillText(`Recorde: ${best}`, W / 2, cardY + cardH + 90);
  }

  c2.fillStyle = '#1a1a1a';
  c2.font = "800 56px 'Nunito', sans-serif";
  c2.shadowColor = 'rgba(0,0,0,.25)'; c2.shadowBlur = 10; c2.shadowOffsetY = 2;
  const ctaLines = wrapCanvasText(c2, `Eu fiz ${score} pontos, venha jogar Voltorbolha também!`, W - 140);
  const lh = 68;
  let ctaY = cardY + cardH + (best ? 200 : 140);
  ctaLines.forEach(line => { c2.fillText(line, W / 2, ctaY); ctaY += lh; });
  c2.shadowColor = 'transparent'; c2.shadowBlur = 0; c2.shadowOffsetY = 0;

  return c;
}

function wrapCanvasText(ctx2d, text, maxWidth) {
  const words = text.split(' ');
  const lines = []; let current = '';
  words.forEach(word => {
    const test = current ? `${current} ${word}` : word;
    if (ctx2d.measureText(test).width > maxWidth && current) { lines.push(current); current = word; }
    else current = test;
  });
  if (current) lines.push(current);
  return lines;
}

function shareResultToStories() {
  let dataUrl = null;
  try { dataUrl = buildResultCanvas().toDataURL('image/png'); }
  catch (e) { console.warn('[shareResultToStories] falhou ao gerar imagem do resultado', e); }
  if (dataUrl) {
    try {
      sessionStorage.setItem('pg_pending_story_image', JSON.stringify({
        image: dataUrl, gameLink: '/jogos/voltorbolha',
      }));
    } catch (e) { console.warn('[shareResultToStories] falhou ao guardar imagem no sessionStorage', e); }
  }
  window.location.href = '/';
}

// ── Sizing responsivo ─────────────────────────────────────
const DESKTOP_MAX_W = 480; // largura confortável tipo "celular" pra quem joga no navegador do PC
function resize() {
  const nav = document.querySelector('.vb-nav');
  const navH = nav ? nav.getBoundingClientRect().height : 52;
  const nextBar = document.querySelector('.vb-next-bar');
  const nextBarH = nextBar ? nextBar.getBoundingClientRect().height : 0;
  let maxW = window.innerWidth;
  if (!gIsMobileLike()) maxW = Math.min(maxW, DESKTOP_MAX_W);
  const maxH = window.innerHeight - navH - nextBarH;
  const midGame = started && !gameOver;
  if (!midGame) {
    BASE_W = Math.max(BASE_W_MIN, Math.round(maxW));
    BASE_H = Math.max(BASE_H_MIN, Math.round(maxH));
    recomputeMetrics();
  }
  canvas.width = BASE_W; canvas.height = BASE_H;
  canvas.style.width = BASE_W + 'px';
  canvas.style.height = BASE_H + 'px';
  if (!midGame && grid.length) draw();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
document.addEventListener('fullscreenchange', () => setTimeout(resize, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('load', () => resize());
setTimeout(resize, 300);

// ── Ranking ────────────────────────────────────────────
async function refreshLeaderboard() {
  const el = document.getElementById('vb-leaderboard');
  const top = await gLoadTopScores('voltorbolha', 5);
  if (top.length === 0) { el.innerHTML = '<div class="vb-lb-empty">Nenhum recorde ainda.</div>'; return; }
  el.innerHTML = top.map((row, i) => `
    <div class="vb-lb-row">
      <span class="vb-lb-pos">${i + 1}º</span>
      <span class="vb-lb-name">${gEsc(row.author_name || '???')}</span>
      <span class="vb-lb-score">${row.score}</span>
    </div>`).join('');
}
async function refreshBest() {
  if (!user) return;
  best = await gLoadMyBest('voltorbolha', user.id);
  document.getElementById('vb-best').textContent = best || '–';
}

// ── Boot ───────────────────────────────────────────────
function tryEnterFullscreenNow() {
  try {
    const el = document.documentElement;
    if (document.fullscreenElement || !el.requestFullscreen || !gIsMobileLike()) return;
    el.requestFullscreen().catch(() => {});
  } catch (e) {}
}

(async function boot() {
  user = await gRequireSession();
  if (!user) return;
  // Fullscreen automático (e no primeiro toque) só faz sentido em
  // celular/tablet — no desktop isso fazia qualquer clique no canvas
  // jogar a tela inteira em fullscreen, o que ninguém pediu.
  if (gIsMobileLike()) {
    tryEnterFullscreenNow();
    gSetupFullscreenOnFirstInteraction();
  }
  recomputeMetrics();
  resize();
  resetGame();
  refreshBest();
})();
</script>
