<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos · Pokégram</title>
<link rel="icon" type="image/x-icon" href="https://64.media.tumblr.com/ebcb74c1a7982e70a9feb6397aaa94cd/8b7e825ce38dd763-27/s1280x1920/dd6884a0d225b480e7cf3d87993f1aa09ee3cbc4.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  button,a{-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:'Nunito',sans-serif;background:#f4f4f4;color:#1a1a1a;
    min-height:100vh;
  }
  :root{
    --brand:#b71c1c;--brand-mid:#e53935;--brand-light:#ffebee;
    --accent:#fdd835;--surface:#fff;--border:#e0e0e0;--muted:#6b7280;
  }

  /* NAV — mesma linguagem visual do Pokégram */
  .gj-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;height:58px;background:var(--brand);
    position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .gj-nav-left{display:flex;align-items:center;gap:14px}
  .gj-back{
    display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;
    font-weight:700;font-size:13px;opacity:.9;transition:opacity .15s;
  }
  .gj-back:hover{opacity:1}
  .gj-back svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .gj-nav-title{font-family:'Cinzel',serif;font-size:16px;color:#fff;letter-spacing:.5px}
  .gj-nav-title span{color:var(--accent)}
  .gj-nav-user{display:flex;align-items:center;gap:8px}
  .gj-avatar{
    width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;
    border:1.5px solid rgba(255,255,255,.5);
  }
  .gj-avatar img{width:100%;height:100%;object-fit:cover}

  .gj-wrap{max-width:840px;margin:0 auto;padding:28px 20px 60px}
  .gj-intro{text-align:center;margin-bottom:28px}
  .gj-intro h1{font-family:'Cinzel',serif;font-size:24px;color:var(--brand);margin:0 0 6px}
  .gj-intro p{color:var(--muted);font-size:14px;margin:0}

  .gj-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px 18px}

  .gj-card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .gj-tile{
    width:100%;aspect-ratio:1/1;border-radius:16px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:44px;
    text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.08);
    transition:transform .15s, box-shadow .15s;
  }
  .gj-tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.14)}
  .gj-tile.tetris{background:linear-gradient(135deg,#b71c1c,#e53935)}
  .gj-tile.flapidgey{background:linear-gradient(135deg,#5b9bd5,#8fc8f7)}
  .gj-tile-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .gj-card-name{
    font-family:'Cinzel',serif;font-size:14px;color:var(--brand);font-weight:700;
    text-decoration:none;line-height:1.25;
  }
  .gj-rank-btn{
    border:1.5px solid var(--border);background:#fff;border-radius:20px;
    padding:5px 14px;font-size:11.5px;font-weight:800;color:var(--muted);
    cursor:pointer;display:flex;align-items:center;gap:4px;
    transition:background .15s,color .15s,border-color .15s;
    font-family:'Nunito',sans-serif;
  }
  .gj-rank-btn:hover,.gj-rank-btn.active{background:var(--brand-light);color:var(--brand);border-color:var(--brand-mid)}

  .gj-lb{width:100%;border-top:1px solid var(--border);padding-top:10px;margin-top:2px;text-align:left}
  .gj-lb-title{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .gj-lb-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
  .gj-lb-pos{width:16px;font-weight:800;color:var(--brand-mid)}
  .gj-lb-av{width:20px;height:20px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800}
  .gj-lb-av img{width:100%;height:100%;object-fit:cover}
  .gj-lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .gj-lb-score{font-weight:800;color:var(--text,#1a1a1a)}
  .gj-lb-prize{font-size:10.5px;font-weight:800;color:#e8a400;margin-left:2px;white-space:nowrap}
  .gj-lb-empty{font-size:12px;color:var(--muted);font-style:italic}

  .gj-week-title{font-family:'Cinzel',serif;font-size:17px;color:var(--brand);text-align:center;margin:0 0 14px}
  .gj-week-game{max-width:340px;margin:0 auto 14px}
  .gj-week-game-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-bottom:6px}
  .gj-week-game-row{font-size:13px;text-align:center;color:var(--text,#1a1a1a);padding:2px 0}
  .gj-week-game-row b{color:var(--brand)}

  .gj-avatar{cursor:pointer}

  .gj-week-trophy-btn{
    border:none;background:transparent;font-size:19px;line-height:1;padding:4px 2px;
    cursor:not-allowed;opacity:.35;filter:grayscale(1);
    transition:opacity .15s, filter .15s;
  }
  .gj-week-trophy-btn.active{cursor:pointer;opacity:1;filter:none}

  .gj-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
  .gj-modal-overlay[hidden]{display:none}
  .gj-modal{background:#fff;border-radius:16px;max-width:360px;width:100%;padding:22px 20px;max-height:80vh;overflow-y:auto;position:relative}
  .gj-modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
  .gj-modal-title{font-family:'Cinzel',serif;font-size:17px;color:var(--brand);margin:0 0 4px;text-align:center}
  .gj-modal-sub{font-size:12px;color:var(--muted);text-align:center;margin:0 0 18px}
  .gj-my-rank-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-radius:12px;background:var(--brand-light);margin-bottom:10px;font-size:13px}
  .gj-my-rank-row:last-child{margin-bottom:0}
  .gj-my-rank-game{font-weight:700;color:var(--text,#1a1a1a)}
  .gj-my-rank-result{font-weight:800;color:var(--brand);white-space:nowrap;text-align:right}

  .gj-loading{
    display:flex;align-items:center;justify-content:center;min-height:60vh;
  }
  .gj-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--brand-mid);border-radius:50%;animation:gj-spin .7s linear infinite}
  @keyframes gj-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="gj-loading" class="gj-loading"><div class="gj-spinner"></div></div>

<div id="gj-app" style="display:none">
  <nav class="gj-nav">
    <div class="gj-nav-left">
      <a class="gj-back" href="/">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar
      </a>
    </div>
    <div class="gj-nav-user">
      <button class="gj-week-trophy-btn" id="gj-week-trophy-btn" onclick="toggleWeekBlock()" aria-label="Vencedores da semana" title="Vencedores da semana">🏆</button>
      <div class="gj-avatar" id="gj-avatar" onclick="openMyRanking()" title="Ver minha classificação"></div>
    </div>
  </nav>

  <div class="gj-wrap">
    <div class="gj-intro">
      <h1>Jogos</h1>
      <p>Encare os melhores treinadores nos rankings abaixo</p>
    </div>

    <div id="gj-week-block" hidden>
      <div class="gj-week-title">🏆 Vencedores da Semana</div>
      <div id="gj-week-winners"><div class="gj-lb-empty" id="gj-week-winners-empty">Ninguém pontuou essa semana ainda.</div></div>
    </div>

    <div class="gj-games">
      <div class="gj-card" id="gj-card-tetris">
        <a class="gj-tile tetris" href="/tetris.html" aria-label="Jogar Pokémon Tetris">
          <img class="gj-tile-cover" id="gj-cover-tetris" src="" alt="" hidden>
          🧩
        </a>
        <a class="gj-card-name" href="/tetris.html">Pokémon Tetris</a>
        <button class="gj-rank-btn" onclick="toggleRanking('tetris', this)">🏆 Ranking</button>
        <div class="gj-lb" id="gj-lb-tetris-wrap" hidden>
          <div class="gj-lb-title">Vencedores da semana</div>
          <div id="gj-lb-tetris"><div class="gj-lb-empty">Carregando...</div></div>
        </div>
      </div>

      <div class="gj-card" id="gj-card-flapidgey">
        <a class="gj-tile flapidgey" href="/flapidgey.html" aria-label="Jogar flaPidgey">
          <img class="gj-tile-cover" id="gj-cover-flapidgey" src="" alt="" hidden>
          🐦
        </a>
        <a class="gj-card-name" href="/flapidgey.html">flaPidgey</a>
        <button class="gj-rank-btn" onclick="toggleRanking('flapidgey', this)">🏆 Ranking</button>
        <div class="gj-lb" id="gj-lb-flapidgey-wrap" hidden>
          <div class="gj-lb-title">Vencedores da semana</div>
          <div id="gj-lb-flapidgey"><div class="gj-lb-empty">Carregando...</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="gj-modal-overlay" id="gj-my-rank-modal" hidden onclick="if(event.target===this) closeMyRanking()">
  <div class="gj-modal">
    <button class="gj-modal-close" onclick="closeMyRanking()" aria-label="Fechar">✕</button>
    <div class="gj-modal-title">🏆 Minha Classificação</div>
    <div class="gj-modal-sub">Sua posição no ranking da semana atual</div>
    <div id="gj-my-rank-body"></div>
  </div>
</div>

<script>
  const SUPABASE_URL  = 'https://cofqapsaxrqlmxzpzbkr.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvZnFhcHNheHJxbG14enB6YmtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0OTMyMjcsImV4cCI6MjA5NTA2OTIyN30.p331KADbBKl6oPSQvxXpDAga3Hx_YwVDZTruKa6Rp8o';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function initials(name) {
    if (!name) return '?';
    const parts = name.trim().split(/[\s_]+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }
  function loadSession() {
    try {
      const val = JSON.parse(localStorage.getItem('pg_user'));
      if (!val) return null;
      if (Array.isArray(val)) return val[0] || null;
      return val;
    } catch (e) { return null; }
  }
  function avatarHtml(u, size) {
    if (u && u.avatar_url) return `<img src="${esc(u.avatar_url)}">`;
    return initials(u ? u.username : '?');
  }
  function avatarBg(u) {
    return (u && u.avatar_url) ? 'transparent' : ((u && u.color) || '#e53935');
  }

  const PRIZES = [500, 300, 100]; // C$ — 1º, 2º, 3º lugar

  // Lista de jogos considerados na classificação pessoal (modal do avatar).
  // Mesmas chaves de game_scores.game usadas no restante da página.
  const GJ_GAMES = [
    { key: 'tetris',    label: '🧩 Pokémon Tetris' },
    { key: 'flapidgey', label: '🐦 flaPidgey' },
  ];

  // Brasília não usa mais horário de verão desde 2019, então o offset
  // fixo (UTC-3) é seguro — mesmo cálculo usado no admin (aba Jogos).
  const GJ_BRT_OFFSET_MS = 3 * 60 * 60 * 1000;
  function gjWeekBoundsBrasilia() {
    const shifted = new Date(Date.now() - GJ_BRT_OFFSET_MS);
    const weekday = shifted.getUTCDay(); // 0 = domingo
    const startShifted = new Date(Date.UTC(
      shifted.getUTCFullYear(), shifted.getUTCMonth(), shifted.getUTCDate() - weekday, 0, 0, 0, 0
    ));
    const start = new Date(startShifted.getTime() + GJ_BRT_OFFSET_MS);
    const end   = new Date(start.getTime() + 7 * 24 * 60 * 60 * 1000);
    return { start, end };
  }

  // O botão "Ranking" (por jogo) só faz sentido no dia em que a semana
  // vira/anuncia os vencedores — só aparece aos domingos, resto da
  // semana fica escondido.
  function isSundayBrasilia() {
    const shifted = new Date(Date.now() - GJ_BRT_OFFSET_MS);
    return shifted.getUTCDay() === 0;
  }

  // Esconde da tela os jogos marcados como "escondido" no admin (aba
  // Jogos → botão "Esconder jogo"). Mesma chave usada lá: settings.hidden_games,
  // um array JSON de chaves de jogo (ex: ["tetris"]).
  async function applyHiddenGames() {    try {
      const { data, error } = await db.from('settings').select('value').eq('key', 'hidden_games').maybeSingle();
      if (error) throw error;
      const hidden = (data && data.value) ? JSON.parse(data.value) : [];
      (Array.isArray(hidden) ? hidden : []).forEach(key => {
        const card = document.getElementById(`gj-card-${key}`);
        if (card) card.style.display = 'none';
      });
    } catch (e) {
      console.warn('[applyHiddenGames]', e);
    }
  }

  // Aplica as capas cadastradas no admin (aba Jogos → Capas dos Jogos).
  // Uma query só busca todas as chaves settings.game_cover_<key> de uma
  // vez (mesmo padrão de settings.game_cover_ usado no admin), então
  // jogos futuros funcionam sem precisar mexer aqui.
  async function applyGameCovers() {
    try {
      const { data, error } = await db.from('settings').select('key, value').like('key', 'game_cover_%');
      if (error) throw error;
      (data || []).forEach(row => {
        if (!row.value) return;
        const key = row.key.replace('game_cover_', '');
        const img = document.getElementById(`gj-cover-${key}`);
        if (!img) return;
        img.src = row.value;
        img.hidden = false;
      });
    } catch (e) {
      console.warn('[applyGameCovers]', e);
    }
  }

  async function boot() {
    // Confirma sessão real no Supabase Auth (mesma sessão do app principal,
    // compartilhada por sessionStorage no mesmo domínio)
    const { data: { session } } = await db.auth.getSession();
    const cached = loadSession();
    if (!session || !cached) {
      window.location.href = '/';
      return;
    }

    const avEl = document.getElementById('gj-avatar');
    avEl.style.background = avatarBg(cached);
    avEl.innerHTML = avatarHtml(cached);

    await applyHiddenGames();
    await applyGameCovers();

    if (!isSundayBrasilia()) {
      document.querySelectorAll('.gj-rank-btn').forEach(btn => btn.hidden = true);
    } else {
      document.getElementById('gj-week-trophy-btn').classList.add('active');
    }

    document.getElementById('gj-loading').style.display = 'none';
    document.getElementById('gj-app').style.display = 'block';

    loadLeaderboard('tetris', 'gj-lb-tetris');
    loadLeaderboard('flapidgey', 'gj-lb-flapidgey');
  }

  // O troféu na nav só fica clicável aos domingos (ver classe "active"
  // aplicada em boot()); durante a semana fica cinza/opaco e não faz nada.
  function toggleWeekBlock() {
    if (!isSundayBrasilia()) return;
    const block = document.getElementById('gj-week-block');
    block.hidden = !block.hidden;
  }

  function toggleRanking(game, btn) {
    const wrap = document.getElementById(`gj-lb-${game}-wrap`);
    const open = wrap.hidden;
    wrap.hidden = !open;
    btn.classList.toggle('active', open);
  }

  function closeMyRanking() {
    document.getElementById('gj-my-rank-modal').hidden = true;
  }

  // Mostra, pra cada jogo, a posição do jogador logado no ranking da
  // semana atual (mesmo recorte de data usado nos cards). Reaproveita
  // o mesmo cálculo de "melhor score por jogador" do loadLeaderboard.
  async function openMyRanking() {
    const modal = document.getElementById('gj-my-rank-modal');
    const body  = document.getElementById('gj-my-rank-body');
    const cached = loadSession();

    body.innerHTML = GJ_GAMES.map(g => `
      <div class="gj-my-rank-row" id="gj-my-rank-${g.key}">
        <span class="gj-my-rank-game">${g.label}</span>
        <span class="gj-my-rank-result">Carregando...</span>
      </div>`).join('');
    modal.hidden = false;

    if (!cached) return;

    const { start, end } = gjWeekBoundsBrasilia();

    await Promise.all(GJ_GAMES.map(async g => {
      const resultEl = document.querySelector(`#gj-my-rank-${g.key} .gj-my-rank-result`);
      try {
        const { data, error } = await db
          .from('game_scores')
          .select('score, user_id')
          .eq('game', g.key)
          .gte('created_at', start.toISOString())
          .lt('created_at', end.toISOString())
          .order('score', { ascending: false })
          .limit(500);
        if (error) throw error;

        const seen = new Set();
        const ranked = [];
        for (const row of (data || [])) {
          if (seen.has(row.user_id)) continue;
          seen.add(row.user_id);
          ranked.push(row);
        }
        const idx = ranked.findIndex(r => r.user_id === cached.id);
        if (idx === -1) {
          resultEl.textContent = 'Sem pontuação essa semana';
        } else {
          resultEl.textContent = `${idx + 1}º lugar`;
        }
      } catch (e) {
        console.warn('[openMyRanking]', g.key, e);
        resultEl.textContent = 'Erro ao carregar';
      }
    }));
  }

  // Monta, dentro do bloco "🏆 Vencedores da Semana" (topo da página, só
  // aos domingos), a lista de vencedores de um jogo — ex: "1º lugar:
  // Fulano (+500C$)". Reaproveita o "top" já calculado em loadLeaderboard.
  function renderWeekWinners(game, top) {
    const label = (GJ_GAMES.find(g => g.key === game) || {}).label || game;
    const rows = top.map((row, i) =>
      `<div class="gj-week-game-row">${i + 1}º lugar: <b>${esc(row.author_name || '???')}</b> (+${PRIZES[i]}C$)</div>`
    ).join('');
    const block = `
      <div class="gj-week-game" id="gj-week-game-${game}">
        <div class="gj-week-game-label">${label}</div>
        ${rows}
      </div>`;
    document.getElementById('gj-week-winners-empty')?.remove();
    const existing = document.getElementById(`gj-week-game-${game}`);
    const wrap = document.getElementById('gj-week-winners');
    if (existing) {
      existing.outerHTML = block;
    } else {
      wrap.insertAdjacentHTML('beforeend', block);
    }
  }

  async function loadLeaderboard(game, elId) {
    const el = document.getElementById(elId);
    try {
      const { start, end } = gjWeekBoundsBrasilia();

      // Melhor score de cada jogador para este jogo, só dentro da semana atual
      const { data, error } = await db
        .from('game_scores')
        .select('score, author_name, author_color, author_avatar, user_id')
        .eq('game', game)
        .gte('created_at', start.toISOString())
        .lt('created_at', end.toISOString())
        .order('score', { ascending: false })
        .limit(50);
      if (error) throw error;

      if (!data || data.length === 0) {
        el.innerHTML = '<div class="gj-lb-empty">Ninguém pontuou essa semana ainda. Seja o primeiro!</div>';
        return false;
      }

      // Mantém só o melhor score por usuário, preservando a ordem (já vem ordenado)
      const seen = new Set();
      const top = [];
      for (const row of data) {
        if (seen.has(row.user_id)) continue;
        seen.add(row.user_id);
        top.push(row);
        if (top.length >= 3) break;
      }

      el.innerHTML = top.map((row, i) => {
        const bg = row.author_avatar ? 'transparent' : (row.author_color || '#e53935');
        const av = row.author_avatar
          ? `<img src="${esc(row.author_avatar)}">`
          : initials(row.author_name);
        return `<div class="gj-lb-row">
          <span class="gj-lb-pos">${i + 1}º</span>
          <span class="gj-lb-av" style="background:${bg}">${av}</span>
          <span class="gj-lb-name">${esc(row.author_name || '???')}</span>
          <span class="gj-lb-prize">${PRIZES[i]}C$</span>
        </div>`;
      }).join('');

      if (isSundayBrasilia()) renderWeekWinners(game, top);
      return true;
    } catch (e) {
      console.warn('[loadLeaderboard]', game, e);
      el.innerHTML = '<div class="gj-lb-empty">Não foi possível carregar o ranking.</div>';
      return false;
    }
  }

  boot();
</script>
</body>
</html>
